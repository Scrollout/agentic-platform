# Go type names for check contract schemas whose generated names would collide or say nothing.
# Applied by oapi-codegen to the bundled contract (scripts/generate.sh); the contract itself is unchanged.
overlay: 1.0.0
info:
  title: Go names for the check service API
  version: 1.0.0
actions:
- target: $.components.schemas.finding
  description: The bundled run-event `finding` would collide with the API's `Finding`.
  update:
    x-go-name: RunEventFinding
- target: $.components.schemas.hash
  description: The bundled slice-defs `hash` would collide with the API's `Hash`.
  update:
    x-go-name: HashValue
- target: $.components.schemas.items
  description: The bundled run-event changed line, named `items` by bundling.
  update:
    x-go-name: ChangedLine
- target: $.components.schemas.Finding.allOf[1].properties.witness.properties
  description: >-
    The check contract's `witness` repeats only `file` (to make it a ProjectPath) and inherits
    `test` from the run-event `finding`; oapi-codegen merges allOf by property, so without this the
    Go type would drop `test`. The contract's validation of the body is unchanged.
  update:
    test:
      type: string
