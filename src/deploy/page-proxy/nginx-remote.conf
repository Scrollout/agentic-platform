# Run page forwarder with remote access (nginx, the `nginx` pin; feature 003, research R5,
# ADR 0062), used instead of nginx.conf only when `ap up --listen` adds compose.remote.yaml. It
# serves the run page to other machines over TLS, behind HTTP Basic authentication, rate-limited
# per client address, and only for the names the developer gave.
#
# Fixed, like nginx.conf: the only data is in /etc/ap/remote/, which `ap` writes and the forwarder
# mounts read-only: cert.pem and key.pem, htpasswd (user `ap`, SHA-512 crypt of the session's
# secret) and names.conf (`server_name <names>;` and `set $page_host "127.0.0.1:<port>";`, every
# name checked by `ap` against a host-name or IP pattern before it is written).
#
# Host: after the name is checked here, the page gets its own expected Host ($page_host), since
# the page accepts only 127.0.0.1:<port>; TLS and the secret are the guard against DNS rebinding.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker's embedded DNS, so a recreated page is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/ap/remote/cert.pem;
    ssl_certificate_key /etc/ap/remote/key.pem;
    ssl_session_cache off;

    # 10 requests per second per client address, a burst of 20, then 429 (FR-016). It is checked
    # before the sign-in, so repeated failed sign-ins are slowed down too.
    limit_req_zone $binary_remote_addr zone=per_client:1m rate=10r/s;
    limit_req_status 429;

    # Any name the developer did not give: 421, no content. A plain HTTP request on this TLS port
    # gets nginx's 400.
    server {
        listen 8443 ssl default_server;
        server_name _;
        limit_req zone=per_client burst=20 nodelay;
        return 421;
    }

    server {
        listen 8443 ssl;
        include /etc/ap/remote/names.conf;
        client_max_body_size 64k;
        limit_req zone=per_client burst=20 nodelay;

        # Every request signs in; a failure is logged (error log, with time and client address),
        # never the password tried.
        auth_basic "agentic-platform run page";
        auth_basic_user_file /etc/ap/remote/htpasswd;

        location / {
            set $page "page:8080";
            proxy_pass http://$page;
            proxy_http_version 1.1;
            proxy_set_header Host $page_host;
            proxy_set_header Authorization "";
            proxy_set_header Connection "";
            # Live views stream; nothing is held back.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
