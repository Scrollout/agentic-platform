# Run page forwarder (nginx, the `nginx` pin; T022a). The only container on the publishing network
# `page-host`: it takes the developer's requests on the published 127.0.0.1 port and passes them to
# the run page on the internal network `page`, from which nothing reaches the host or the outside.
# The whole configuration is this file: no template, no variable, no upstream taken from a request.
#
# Host: passed through exactly as the client sent it (name and port). The page checks it against
# its one allowed Host (PAGE_HOST), which is the DNS rebinding guard; the forwarder checks nothing.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker's embedded DNS, so a recreated page is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080 default_server;
        server_name _;
        client_max_body_size 64k;

        location / {
            set $page "page:8080";
            proxy_pass http://$page;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            # Live views stream; nothing is held back.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
