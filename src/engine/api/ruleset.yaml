# Spectral ruleset for the platform's OpenAPI contracts (ADR 0004, constitution Principle XV).
extends: ["spectral:oas"]

functionsDir: ./ruleset-functions
functions: [requiresApiVersion, listHasPageToken, declaresLimits]

rules:
  operation-operationId: error
  operation-description: error

  ap-api-version-required:
    description: Every operation except /providers/... requires the api-version query parameter.
    message: "{{error}}"
    severity: error
    given: "$.paths[*]"
    then:
      function: requiresApiVersion

  ap-list-has-page-token:
    description: A GET whose 200 response has an items array accepts page_token.
    message: "{{error}}"
    severity: error
    given: "$.paths[*]"
    then:
      function: listHasPageToken

  ap-problem-has-code:
    description: The Problem schema requires a stable error code.
    message: Problem must require `code`.
    severity: error
    given: "$.components.schemas.Problem.required"
    then:
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            const: code

  ap-limits-declared:
    description: Every service contract declares the limits every client sees in a root x-limits object, each a positive integer.
    message: "{{error}}"
    severity: error
    given: "$"
    then:
      function: declaresLimits
      functionOptions:
        keys:
          - requests-per-second-per-token
          - requests-per-second-per-address-without-token
          - idempotency-key-retention-hours
          - request-body-max-bytes
