openapi: 3.1.0
info:
  title: Agentic Platform engine API
  version: 2026-11-12-preview
  description: >-
    Turns a developer's description into an approved slice and builds it into accepted working
    software. It is the only way to manage slices and runs. Every operation requires the
    `api-version` query parameter, except `GET /providers/Agentic.Engine/operations`. Each operation
    states which tokens may call it: the client token may call every developer operation, the page
    token only GET operations, and a worker token only registerWorker; any other call returns 403
    Forbidden. Each token may make at most `x-limits.requests-per-second-per-token` requests in any
    one-second window; more return 429 with `Retry-After`. A request with no token, or with a token
    the engine does not accept for this session, is counted instead by its source address (the
    peer address of the connection, never a header the client sends): each address may make at
    most `x-limits.requests-per-second-per-address-without-token` such requests in any one-second
    window; up to that limit they get 401, and beyond it 429 with `Retry-After`. A request with an
    accepted token is counted only per token, never per address. A request body larger than
    `x-limits.request-body-max-bytes` (bytes) returns 400 InvalidRequest. A request body must be
    sent with `Content-Type: application/json` (parameters such as `charset=utf-8` may follow);
    a body with no Content-Type or any other one does not match this contract and returns 400
    InvalidRequest. Every state change
    returns an operation to follow. Any operation may end with the error OperationFailed; being
    universal, it is not repeated in each operation's `x-error-codes`. A deprecated operation is marked `deprecated: true`
    with `x-sunset`, and its responses carry `Deprecation`, `Sunset` and `Link: rel="deprecation"`.
    `x-operation-name` gives each operation's permission name, and `x-error-codes` lists the
    problem codes each status code (and the operation's `error`) may carry. `x-limits` holds the
    limits every client sees, once. A state change is accepted (202, or 200 for registerWorker)
    only after it is recorded durably; when it cannot be, the answer is 503 Unavailable with
    `Retry-After`, nothing was accepted, and the same request may be sent again (with the same
    Idempotency-Key where the operation takes one). An
    operation is followed by its ID until `x-limits.idempotency-key-retention-hours` after it
    ends; after that `getOperation` answers 404 NotFound. An operation ID is never given to two
    operations, across restarts of the engine too, and an Idempotency-Key and its first result
    survive a restart within their retention. The `retry-*` limits are the one retry rule the
    engine and its clients apply to a call that failed retryably: retry `n` (from 0) waits
    `min(retry-longest-wait-ms, retry-first-wait-ms × 2^n)` plus a uniform random part of up to
    `retry-jitter-fraction` of that wait, at most `retry-attempts` times.
  contact:
    name: Agentic Platform maintainers
  license:
    name: MIT
    identifier: MIT
x-limits:
  # Requests one token may make in any one-second window (sliding); more get 429.
  requests-per-second-per-token: 20
  # Requests without an accepted token one source address may make in any one-second window
  # (sliding).
  requests-per-second-per-address-without-token: 20
  # Hours an Idempotency-Key and its first result are kept, from the first request.
  idempotency-key-retention-hours: 24
  # Largest request body accepted, in bytes; a larger one gets 400 InvalidRequest.
  request-body-max-bytes: 1048576
  # Retries after the first try of a call that failed retryably, by the engine and its clients.
  retry-attempts: 3
  # The first retry's wait, in milliseconds; each further retry doubles it, up to the longest wait.
  retry-first-wait-ms: 1000
  # The longest wait before a retry, in milliseconds, before the random part is added.
  retry-longest-wait-ms: 30000
  # Each wait adds a uniform random part of up to this fraction of itself.
  retry-jitter-fraction: 0.5
servers:
- url: /
  description: The engine's address on the platform's internal network; not reachable from outside it.
tags:
- name: slices
  description: Describe, clarify, change and approve a slice.
- name: runs
  description: Build an approved slice and inspect its runs.
- name: operations
  description: Follow and cancel long-running work, and list this service's operations.
- name: workers
  description: Step workers announce that they are ready.
paths:
  /slices:
    post:
      tags:
      - slices
      operationId: createSlice
      x-operation-name: Agentic.Engine/slices/write
      summary: Propose a slice from a description
      description: Proposes a slice from the developer's prose. The operation's target is the new slice;
        when it succeeds the slice holds goals, terms, rules, examples, a contract, any questions and
        its check results. At most 4 operations that need the analyst (createSlice and answerQuestions)
        work at once across the engine; any other waits, `running`, until one ends, and one
        cancelled while it waits never calls the analyst.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '409': [IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
        operation: [NarrowDescription, TooManyQuestions, BudgetExhausted]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSliceRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags:
      - slices
      operationId: listSlices
      x-operation-name: Agentic.Engine/slices/read
      summary: List slices
      description: Lists slices, newest first, at most 50 per page.
      security:
      - clientToken: []
      - pageToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '429': [RateLimited]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          $ref: '#/components/responses/SliceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /slices/{sliceId}:
    get:
      tags:
      - slices
      operationId: getSlice
      x-operation-name: Agentic.Engine/slices/read
      summary: Get a slice
      description: Returns the slice with its goals, terms, rules, examples, contract, questions, part
        hashes, approvals, check results and history.
      security:
      - clientToken: []
      - pageToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '429': [RateLimited]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      responses:
        '200':
          $ref: '#/components/responses/Slice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
      - slices
      operationId: deleteSlice
      x-operation-name: Agentic.Engine/slices/delete
      summary: Delete a slice and its runs
      description: Erases the slice, its run records and their stored artifacts. Project folders are
        left to the developer. Refused while one of the slice's runs has not ended. The operation's
        target is the slice.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/goals:
    put:
      tags:
      - slices
      operationId: replaceGoals
      x-operation-name: Agentic.Engine/slices/write
      summary: Replace a slice's goals
      description: Replaces all goals. The slice's checks run again and the goals approval is withdrawn.
        The operation's target is the slice.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalsPart'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/rules:
    put:
      tags:
      - slices
      operationId: replaceRules
      x-operation-name: Agentic.Engine/slices/write
      summary: Replace a slice's rules, examples and terms
      description: Replaces the rules, the examples and the terms together. The slice's checks run again
        and the rules approval is withdrawn. The operation's target is the slice.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesPart'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/contract:
    put:
      tags:
      - slices
      operationId: replaceContract
      x-operation-name: Agentic.Engine/slices/write
      summary: Replace a slice's contract
      description: Replaces the contract. The slice's checks run again and the contract approval is
        withdrawn. The operation's target is the slice.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractPart'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/answers:
    post:
      tags:
      - slices
      operationId: answerQuestions
      x-operation-name: Agentic.Engine/slices/answers/write
      summary: Answer open questions
      description: Records the developer's answers with the slice. The slice is then revised and checked
        again, and may hold new questions, up to 10 in total. The operation's target is the slice.
        At most 4 operations that need the analyst (createSlice and answerQuestions) work at once
        across the engine; any other waits, `running`, until one ends, and one cancelled while it
        waits never calls the analyst.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [QuestionNotOpen, RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
        operation: [TooManyQuestions, BudgetExhausted]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/approvals:
    post:
      tags:
      - slices
      operationId: approvePart
      x-operation-name: Agentic.Engine/slices/approvals/write
      summary: Approve part of a slice
      description: Approves the goals, the rules (with examples and terms) or the contract at the hash the
        developer reviewed. Refused while the part fails a check, an open question concerns it, the hash
        is stale, or, for the contract, the pattern does not fit. The operation's target is the slice.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [PartFailsChecks, ContradictionOpen, StaleContentHash, PatternDoesNotFit, RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/runs:
    post:
      tags:
      - runs
      operationId: startRun
      x-operation-name: Agentic.Engine/runs/write
      summary: Build an approved slice
      description: Starts a run that builds the slice into a new project folder. Refusals come in this
        order, the first that applies; each comes at once, and no operation is created. A body that
        does not match RunRequest is InvalidRequest, or InvalidProject when only its project name
        breaks the folder-name rule; then an unknown slice is NotFound; then PatternDoesNotFit while the slice fails a pattern condition, even when
        no part is approved; then NotApproved while a part is not approved at its current hash; then
        WorkersNotReady while a step of the pattern has no ready worker; then RunActive while any
        run, of any slice, has not ended (at most one active run on the platform, FR-021); then
        ProjectExists when the folder exists. The operation's target is the new run; it lasts until
        the run ends.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest, InvalidProject]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [NotApproved, PatternDoesNotFit, WorkersNotReady, RunActive, ProjectExists, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs:
    get:
      tags:
      - runs
      operationId: listRuns
      x-operation-name: Agentic.Engine/runs/read
      summary: List runs
      description: Lists runs, newest first, at most 50 per page.
      security:
      - clientToken: []
      - pageToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '429': [RateLimited]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          $ref: '#/components/responses/RunList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /runs/{runId}:
    get:
      tags:
      - runs
      operationId: getRun
      x-operation-name: Agentic.Engine/runs/read
      summary: Get a run
      description: Returns the run with its status and, once it has ended, its outcome.
      security:
      - clientToken: []
      - pageToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '429': [RateLimited]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          $ref: '#/components/responses/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /runs/{runId}/events:
    get:
      tags:
      - runs
      operationId: listRunEvents
      x-operation-name: Agentic.Engine/runs/events/read
      summary: List a run's recorded events
      description: Returns the run record in `seq` order, at most 100 events per page. Until the run
        ends, the last page still has a `next_page_token`; using it later returns the events recorded
        since.
        Once the run has ended and the last page has been read, `next_page_token` is omitted; a client
        has read the whole record when a page comes back without it.
      security:
      - clientToken: []
      - pageToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '429': [RateLimited]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          $ref: '#/components/responses/RunEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /runs/{runId}/artifacts/{hash}:
    get:
      tags:
      - runs
      operationId: getArtifact
      x-operation-name: Agentic.Engine/runs/artifacts/read
      summary: Get an artifact of a run
      description: Returns the content of an artifact the run's record names, with its media type.
      security:
      - clientToken: []
      - pageToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '429': [RateLimited]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/ArtifactHash'
      responses:
        '200':
          $ref: '#/components/responses/Artifact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /runs/{runId}/comparison:
    get:
      tags:
      - runs
      operationId: compareRuns
      x-operation-name: Agentic.Engine/runs/read
      summary: Compare two runs
      description: Lists the steps whose artifacts, check results or decisions differ between this run
        and another, in step order, at most 50 per page.
      security:
      - clientToken: []
      - pageToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '429': [RateLimited]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/RunId'
      - name: with
        in: query
        required: true
        description: The other run's ID.
        schema:
          $ref: slice-defs.schema.json#/$defs/run_id
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          $ref: '#/components/responses/DifferenceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /runs/{runId}/resume:
    post:
      tags:
      - runs
      operationId: resumeRun
      x-operation-name: Agentic.Engine/runs/resume/action
      summary: Resume an interrupted run
      description: Continues an `interrupted` run without repeating its accepted steps; a run that waits
        for its step workers is refused with WorkersNotReady until they register, and then continues
        by itself. Returns the run's operation; its target is the run. RunActive while any other run, of any slice, has not ended.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [RunNotInterrupted, WorkersNotReady, RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{runId}/replay:
    post:
      tags:
      - runs
      operationId: replayRun
      x-operation-name: Agentic.Engine/runs/replay/action
      summary: Replay an ended run
      description: Starts a new run of the same slice and pattern version into a new project folder. It
        reuses every accepted result of the earlier run, so its artifacts are identical. The operation's
        target is the new run. RunActive while any other run, of any slice, has not ended.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest, InvalidProject]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [RunNotEnded, WorkersNotReady, RunActive, ProjectExists, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{runId}/hand-over:
    post:
      tags:
      - runs
      operationId: acceptHandOver
      x-operation-name: Agentic.Engine/runs/handOver/action
      summary: Accept a run's hand-over
      description: The developer takes over a run that is `waiting-for-developer`; the run ends with the
        outcome `handed-over` and its project folder is the developer's to finish. Returns the run's
        operation; its target is the run.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [RunNotWaiting, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /operations/{operationId}:
    get:
      tags:
      - operations
      operationId: getOperation
      x-operation-name: Agentic.Engine/operationStatuses/read
      summary: Follow a long-running operation
      description: Returns the operation's status, its progress and, when it has finished, its result or
        error.
      security:
      - clientToken: []
      - pageToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '429': [RateLimited]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          $ref: '#/components/responses/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /operations/{operationId}/cancel:
    post:
      tags:
      - operations
      operationId: cancelOperation
      x-operation-name: Agentic.Engine/operationStatuses/cancel/action
      summary: Cancel an operation
      description: Stops the operation; it ends `cancelled`. Cancelling a run's operation ends the run with
        the outcome `cancelled`, whether it is running, interrupted or waiting for the developer.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [OperationEnded, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/OperationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /workers:
    post:
      tags:
      - workers
      operationId: registerWorker
      x-operation-name: Agentic.Engine/workers/write
      summary: Register a step worker
      description: Tells the engine that the worker for one step of one slice is ready at `endpoint`. The
        slice and step are those its worker token was issued for. Registering again replaces the
        endpoint. A registration is kept across an engine restart until it is replaced, its worker
        token's grant is removed, or its slice is erased, so the worker need not register again
        after the engine restarts. It returns 404 when that slice no longer exists or the slice's pattern has no such
        step. Unlike other state changes it takes effect at once and returns the registration, not an
        operation, because a worker token cannot follow operations. A run waiting for this slice's
        step workers continues once each of its steps has a registered worker. When the engine cannot
        record the registration durably it answers 503 Unavailable and nothing changed; register
        again after `Retry-After`.
      security:
      - workerToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRegistration'
      responses:
        '200':
          $ref: '#/components/responses/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /providers/Agentic.Engine/operations:
    get:
      tags:
      - operations
      operationId: listProviderOperations
      x-operation-name: Agentic.Engine/operations/read
      summary: List this service's operations
      description: Lists the operations this service offers, by permission name and display text, at
        most 50 per page. It takes no api-version; it holds the `x-operation-name` and `summary` of every
        operation in every version this service serves, as one entry per permission name, whose display
        text is the `summary` of each operation with that name, in contract order, joined by "; ". A
        `page_token` this service did not issue returns 400 InvalidRequest.
      security:
      - clientToken: []
      - pageToken: []
      x-error-codes:
        '400': [InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '429': [RateLimited]
      parameters:
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          $ref: '#/components/responses/ProviderOperationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    clientToken:
      type: http
      scheme: bearer
      description: The terminal client's token for this session. It may call every operation except
        registerWorker.
    pageToken:
      type: http
      scheme: bearer
      description: The run page's token for this session. It may call only GET operations.
    workerToken:
      type: http
      scheme: bearer
      description: A step worker's token, issued for one step of one slice. It may call only
        registerWorker.
  parameters:
    ApiVersion:
      name: api-version
      in: query
      required: true
      description: The API version. This contract is 2026-11-12-preview. A missing value returns 400
        MissingApiVersionParameter; any other value returns 400 UnsupportedApiVersionValue.
      schema:
        $ref: slice-defs.schema.json#/$defs/api_version
        examples:
        - 2026-11-12-preview
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Kept for `x-limits.idempotency-key-retention-hours`. Repeating a request with the same key returns the first result; a
        different body with the same key returns 409 IdempotencyKeyReused.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PageToken:
      name: page_token
      in: query
      required: false
      description: The `next_page_token` of the previous page; omit it for the first page. A token
        is bound to the list that issued it and is opaque; one this service did not issue, or one
        issued by another list, returns 400 InvalidRequest. A slice list token names the last slice
        of its page, so slices created or deleted between pages are neither repeated nor make
        another skipped. Tokens do not outlive a restart of the engine.
      schema:
        type: string
        minLength: 1
    SliceId:
      name: sliceId
      in: path
      required: true
      description: The slice's ID.
      schema:
        $ref: slice-defs.schema.json#/$defs/slice_id
    RunId:
      name: runId
      in: path
      required: true
      description: The run's ID.
      schema:
        $ref: slice-defs.schema.json#/$defs/run_id
    OperationId:
      name: operationId
      in: path
      required: true
      description: The operation's ID.
      schema:
        $ref: slice-defs.schema.json#/$defs/operation_id
    ArtifactHash:
      name: hash
      in: path
      required: true
      description: The artifact's SHA-256, as the run record names it.
      schema:
        $ref: slice-defs.schema.json#/$defs/hash
  headers:
    Deprecation:
      description: When the operation was deprecated (RFC 9745); only on deprecated operations.
      schema:
        type: string
    Sunset:
      description: When the operation stops working (RFC 8594); only on deprecated operations.
      schema:
        type: string
    Link:
      description: A `rel="deprecation"` link to the migration notes; only on deprecated operations.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        minimum: 1
  responses:
    Accepted:
      description: Accepted; follow the operation.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
    Operation:
      description: The operation.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
    Slice:
      description: The slice.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Slice'
    SliceList:
      description: A page of slices.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SliceList'
    Run:
      description: The run.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Run'
    RunList:
      description: A page of runs.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RunList'
    RunEventList:
      description: A page of the run record.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RunEventList'
    Artifact:
      description: The artifact's content, with the media type it was recorded with as `Content-Type`.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        '*/*':
          schema:
            type: string
            format: binary
    DifferenceList:
      description: A page of differences; empty when the runs match.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DifferenceList'
    Worker:
      description: The registration as the engine holds it.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Worker'
    ProviderOperationList:
      description: A page of operations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderOperationList'
    BadRequest:
      description: The request is malformed; `code` and `detail` say what to fix.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: The token is missing or not valid for this session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token is valid but may not call this operation. Where the operation has a 404
        response, a slice, run or step that exists but is not for the caller is reported there as
        not found, the same as one that does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The slice, run, operation or artifact does not exist, or it exists but is not for
        this slice or step.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Refused in the current state; `code` names why and `failures` lists any failing checks.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: More than `x-limits.requests-per-second-per-token` requests in one second with this token, or more than
        `x-limits.requests-per-second-per-address-without-token` requests without an accepted token from this source address; try again
        after `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: The engine could not record the change durably, so nothing was accepted; send the
        same request again (with the same Idempotency-Key where the operation takes one) after
        `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnavailableProblem'
  schemas:
    ErrorCode:
      type: string
      description: >-
        A stable problem code. InvalidRequest: the body or a parameter does not match this contract.
        MissingApiVersionParameter, UnsupportedApiVersionValue: the api-version is missing or not
        served. Unauthorized, Forbidden: see 401 and 403. NotFound: the resource does not exist.
        RateLimited: more requests in one second than `x-limits.requests-per-second-per-token` with one token, or than
        `x-limits.requests-per-second-per-address-without-token` without an accepted token from one source address. IdempotencyKeyReused: the key was used with a
        different body. NarrowDescription: the description covers more than one use case; describe
        one. TooManyQuestions: the slice would need more than 10 questions; narrow the description.
        QuestionNotOpen: the question does not exist or is answered. ContradictionOpen: an open
        question concerns the part. PartFailsChecks: the part fails a check, listed in `failures`.
        StaleContentHash: the part changed since it was shown. NotApproved: a part is not approved.
        PatternDoesNotFit: the slice fails a pattern condition, listed in `failures`. WorkersNotReady:
        a step of the pattern has no registered worker. RunActive: a run has not ended. ProjectExists:
        the project folder exists. InvalidProject: the project name is not a valid folder name.
        RunNotInterrupted: the run is not interrupted. RunNotWaiting: the run is not waiting for the
        developer. RunNotEnded: the run has not ended. OperationEnded: the operation has finished.
        BudgetExhausted: the work used its token, cost or time budget. OperationFailed: the work
        failed for a reason no other code names, after any retries; `detail` says why. A 503
        answer has its own problem, UnavailableProblem, whose code is always Unavailable.
      enum:
      - InvalidRequest
      - MissingApiVersionParameter
      - UnsupportedApiVersionValue
      - Unauthorized
      - Forbidden
      - NotFound
      - RateLimited
      - IdempotencyKeyReused
      - NarrowDescription
      - TooManyQuestions
      - QuestionNotOpen
      - ContradictionOpen
      - PartFailsChecks
      - StaleContentHash
      - NotApproved
      - PatternDoesNotFit
      - WorkersNotReady
      - RunActive
      - ProjectExists
      - InvalidProject
      - RunNotInterrupted
      - RunNotWaiting
      - RunNotEnded
      - OperationEnded
      - BudgetExhausted
      - OperationFailed
    Problem:
      type: object
      description: An RFC 9457 problem with a stable `code`.
      required:
      - type
      - title
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        failures:
          type: array
          description: Each failing check, naming the part and the reason.
          items:
            $ref: '#/components/schemas/CheckResult'
        supported_versions:
          type: array
          description: With UnsupportedApiVersionValue, the api-versions this service serves.
          items:
            type: string
    UnavailableProblem:
      type: object
      description: An RFC 9457 problem for a 503 answer; its `code` is always Unavailable. It is kept
        apart from Problem so that the codes every other answer may carry stay as they were.
      required:
      - type
      - title
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          const: Unavailable
    CheckResult:
      $ref: slice-defs.schema.json#/$defs/check_result
    Slice:
      $ref: slice.schema.json
    RunEvent:
      $ref: run-event.schema.json
    GoalsPart:
      $ref: slice-defs.schema.json#/$defs/goals_part
    RulesPart:
      $ref: slice-defs.schema.json#/$defs/rules_part
    ContractPart:
      $ref: slice-defs.schema.json#/$defs/contract_part
    CreateSliceRequest:
      type: object
      required:
      - description
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 4000
          description: The developer's prose about one use case, at most 4000 characters.
    Answer:
      type: object
      required:
      - question
      - answer
      additionalProperties: false
      properties:
        question:
          $ref: slice-defs.schema.json#/$defs/question_id
        answer:
          $ref: slice-defs.schema.json#/$defs/answer
    AnswerRequest:
      type: object
      required:
      - answers
      additionalProperties: false
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 10
          description: One answer per open question. An `option` must be one of the question's options.
          items:
            $ref: '#/components/schemas/Answer'
    ApprovalRequest:
      type: object
      required:
      - part
      - content_hash
      additionalProperties: false
      properties:
        part:
          $ref: slice-defs.schema.json#/$defs/part
        content_hash:
          $ref: slice-defs.schema.json#/$defs/hash
          description: The part's hash as the developer reviewed it, from the slice's `parts`.
    RunRequest:
      type: object
      required:
      - project
      additionalProperties: false
      properties:
        project:
          $ref: slice-defs.schema.json#/$defs/project_name
          description: The name of the new project folder, created under the projects folder chosen when
            the platform started. It must not exist yet.
    WorkerRegistration:
      type: object
      required:
      - endpoint
      additionalProperties: false
      properties:
        endpoint:
          $ref: slice-defs.schema.json#/$defs/worker_endpoint
          description: >-
            The worker's base address on the internal network: `http://`, a host name of lowercase
            letters, digits and hyphens (such as its Compose service name), a port, and nothing
            after an optional `/`.
    Worker:
      type: object
      required:
      - slice
      - step
      - endpoint
      properties:
        slice:
          $ref: slice-defs.schema.json#/$defs/slice_id
        step:
          $ref: slice-defs.schema.json#/$defs/step_name
        endpoint:
          $ref: slice-defs.schema.json#/$defs/worker_endpoint
          description: The registered base address, as `WorkerRegistration.endpoint` defines it.
    OperationKind:
      type: string
      description: What the operation does. Resuming, replaying and handing over a run all use the kind `run`.
      enum:
      - propose-slice
      - answer-questions
      - replace-goals
      - replace-rules
      - replace-contract
      - approve-part
      - delete-slice
      - run
    OperationStatus:
      type: string
      enum:
      - accepted
      - running
      - succeeded
      - failed
      - cancelled
    Operation:
      type: object
      description: Long-running work. A `run` operation lasts from the start of its run until the run
        ends, and succeeds whatever the run's outcome, except `cancelled`; the outcome is on the run.
        When the platform could not carry the run on, the operation fails with the run's reason.
      required:
      - id
      - kind
      - status
      - target
      - created_at
      - updated_at
      properties:
        id:
          $ref: slice-defs.schema.json#/$defs/operation_id
        kind:
          $ref: '#/components/schemas/OperationKind'
        status:
          $ref: '#/components/schemas/OperationStatus'
        target:
          $ref: slice-defs.schema.json#/$defs/slice_or_run_id
          description: The slice or run the operation concerns.
        progress:
          type: object
          description: For a `run` operation, how many of the pattern's steps are accepted.
          required:
          - done
          - total
          properties:
            done:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 1
            step:
              type: string
              description: The step in progress.
        result:
          type: object
          description: Set when the operation succeeded. `slice` is the slice it created or changed, `run`
            the run it started or continued, and `reused_slice` an existing slice with the same
            description, returned instead of a new one.
          minProperties: 1
          maxProperties: 1
          additionalProperties: false
          properties:
            slice:
              $ref: slice-defs.schema.json#/$defs/slice_id
            run:
              $ref: slice-defs.schema.json#/$defs/run_id
            reused_slice:
              $ref: slice-defs.schema.json#/$defs/slice_id
        error:
          $ref: '#/components/schemas/Problem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SliceSummary:
      type: object
      required:
      - id
      - title
      - state
      properties:
        id:
          $ref: slice-defs.schema.json#/$defs/slice_id
        title:
          type: string
        state:
          $ref: slice.schema.json#/properties/state
        latest_run:
          $ref: slice-defs.schema.json#/$defs/run_id
    SliceList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SliceSummary'
        next_page_token:
          type: string
    RunStatus:
      type: string
      description: >-
        `running`; `interrupted` while the run waits for the developer because the model was
        unavailable on every attempt of a step (resume it with resumeRun), or for its step workers
        (it continues by itself once they register; resumeRun answers WorkersNotReady until then); a
        platform stop alone leaves a run `running`, and it continues by itself once the platform is
        up again;
        `waiting-for-developer` when a step or review ran out of attempts or the budget ran out, with
        the reason; `ended`, with an outcome.
      enum:
      - running
      - interrupted
      - waiting-for-developer
      - ended
    RunOutcome:
      type: string
      description: >-
        `done` when every step is accepted; `handed-over` when the developer accepted the hand-over;
        `expired` when the run waited 14 days for the developer; `cancelled` when its operation was
        cancelled, or when the platform could not carry the run on (its `RunCancelled` detail
        begins `the run's workflow failed:` and says why; its operation then fails).
      enum:
      - done
      - handed-over
      - expired
      - cancelled
    Run:
      type: object
      if:
        required:
        - status
        properties:
          status:
            const: ended
      then:
        required:
        - outcome
        - ended_at
      else:
        not:
          anyOf:
          - required:
            - outcome
          - required:
            - ended_at
      required:
      - id
      - slice
      - pattern
      - project
      - status
      - operation
      - created_at
      - updated_at
      properties:
        id:
          $ref: slice-defs.schema.json#/$defs/run_id
        slice:
          $ref: slice-defs.schema.json#/$defs/slice_id
        pattern:
          $ref: slice-defs.schema.json#/$defs/pattern_ref
          description: Pattern ID and version, as `<id>@<version>`.
        project:
          $ref: slice-defs.schema.json#/$defs/project_name
          description: The project folder's name under the projects folder.
        status:
          $ref: '#/components/schemas/RunStatus'
        outcome:
          $ref: '#/components/schemas/RunOutcome'
        reason:
          type: string
          description: Why the run waits for the developer, or why it ended other than `done`.
        expires_at:
          type: string
          format: date-time
          description: While the run is interrupted or waiting for the developer, when it ends `expired`
            (14 days after it stopped).
        operation:
          $ref: slice-defs.schema.json#/$defs/operation_id
          description: The run's operation.
        replay_of:
          $ref: slice-defs.schema.json#/$defs/run_id
          description: For a replay, the run it replays.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Set with `outcome` when the run ends.
    RunList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        next_page_token:
          type: string
    RunEventList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        next_page_token:
          type: string
    Difference:
      type: object
      required:
      - step
      - field
      properties:
        step:
          $ref: slice-defs.schema.json#/$defs/step_name
        field:
          type: string
          enum:
          - artifacts
          - checks
          - decision
        left:
          type: string
          description: >-
            The value in this run, as text: for `artifacts`, the content hash; for `checks`,
            `passed` or `failed: <reason>`; for `decision`, its JSON text. Absent when this run has
            no value for the step and field (for example, it never reached the step).
        right:
          type: string
          description: The value in the other run, in the same form as `left`, and absent in the
            same case.
    DifferenceList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Difference'
        next_page_token:
          type: string
    ProviderOperation:
      type: object
      required:
      - name
      - display
      properties:
        name:
          type: string
          pattern: ^Agentic\.Engine/[A-Za-z/]+/(read|write|delete|action)$
          description: The permission name, for example `Agentic.Engine/slices/read`.
        display:
          type: string
          description: The `summary` of each operation with this permission name, in contract order,
            joined by "; ".
    ProviderOperationList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderOperation'
        next_page_token:
          type: string
