openapi: 3.1.0
info:
  title: Agentic Platform engine API
  version: 2026-11-12-preview
  description: >-
    Turns a developer's description into an approved slice and builds it into accepted working
    software. It is the only way to manage slices and runs. Every operation requires the
    `api-version` query parameter, except `GET /providers/Agentic.Engine/operations`. Each operation
    states which tokens may call it: the client token may call every developer operation, the page
    token only GET operations, and a worker token only registerWorker; any other call returns 403
    Forbidden. Each token may make at most `x-limits.requests-per-second-per-token` requests in any
    one-second window; more return 429 with `Retry-After`. A request with no token, or with a token
    the engine does not accept for this session, is counted instead by its source address (the
    peer address of the connection, never a header the client sends): each address may make at
    most `x-limits.requests-per-second-per-address-without-token` such requests in any one-second
    window; up to that limit they get 401, and beyond it 429 with `Retry-After`. A request with an
    accepted token is counted only per token, never per address. A request body larger than
    `x-limits.request-body-max-bytes` (bytes) returns 400 InvalidRequest. A request body must be
    sent with `Content-Type: application/json` (parameters such as `charset=utf-8` may follow);
    a body with no Content-Type or any other one does not match this contract and returns 400
    InvalidRequest. Every state change
    returns an operation to follow. Any operation may end with the error OperationFailed; being
    universal, it is not repeated in each operation's `x-error-codes`. A deprecated operation is marked `deprecated: true`
    with `x-sunset`, and its responses carry `Deprecation`, `Sunset` and `Link: rel="deprecation"`.
    `x-operation-name` gives each operation's permission name, and `x-error-codes` lists the
    problem codes each status code (and the operation's `error`) may carry. `x-limits` holds the
    limits every client sees, once. A state change is accepted (202, or 200 for registerWorker)
    only after it is recorded durably; when it cannot be, the answer is 503 Unavailable with
    `Retry-After`, nothing was accepted, and the same request may be sent again (with the same
    Idempotency-Key where the operation takes one). An
    operation is followed by its ID until `x-limits.idempotency-key-retention-hours` after it
    ends; after that `getOperation` answers 404 NotFound. An operation ID is never given to two
    operations, across restarts of the engine too, and an Idempotency-Key and its first result
    survive a restart within their retention when the request created a new operation; any
    other answer under a key (a refusal, registerWorker's 200, cancelOperation's 202, an operation already open) is kept
    until the engine restarts, and a 503 is never kept. The `retry-*` limits are the one retry rule the
    engine and its clients apply to a call that failed retryably: retry `n` (from 0) waits
    `min(retry-longest-wait-ms, retry-first-wait-ms × 2^n)` plus a uniform random part of up to
    `retry-jitter-fraction` of that wait, at most `retry-attempts` times.
  contact:
    name: Agentic Platform maintainers
  license:
    name: MIT
    identifier: MIT
x-limits:
  # Requests one token may make in any one-second window (sliding); more get 429.
  requests-per-second-per-token: 20
  # Requests without an accepted token one source address may make in any one-second window
  # (sliding).
  requests-per-second-per-address-without-token: 20
  # Hours an Idempotency-Key and its first result are kept, from the first request.
  idempotency-key-retention-hours: 24
  # Largest request body accepted, in bytes; a larger one gets 400 InvalidRequest.
  request-body-max-bytes: 1048576
  # Retries after the first try of a call that failed retryably, by the engine and its clients.
  retry-attempts: 3
  # The first retry's wait, in milliseconds; each further retry doubles it, up to the longest wait.
  retry-first-wait-ms: 1000
  # The longest wait before a retry, in milliseconds, before the random part is added.
  retry-longest-wait-ms: 30000
  # Each wait adds a uniform random part of up to this fraction of itself.
  retry-jitter-fraction: 0.5
  # Most parameters of one captured pattern (ParametersRequest, CapturedPattern).
  captured-pattern-parameters-max: 32
  # Most places one parameter's value may occur in a captured pattern's slice and template;
  # more is ParameterRefused.
  parameter-places-max: 10000
  # Most characters of one parameter value (slice-defs `parameter_value`).
  parameter-value-max-chars: 64
  # Most trials of one trial set (TrialSetRequest.trials).
  trials-max: 5
  # Trials of a trial set when the request gives none.
  trials-default: 3
  # A trial set's cost budget in US dollars, over all its trials, on top of each run's own budgets.
  trial-set-cost-usd: 2
  # Hours a trial set may run, from its acceptance; then its running trial is cancelled.
  trial-set-hours: 24
servers:
- url: /
  description: The engine's address on the platform's internal network; not reachable from outside it.
tags:
- name: slices
  description: Describe, clarify, change and approve a slice.
- name: runs
  description: Build an approved slice and inspect its runs.
- name: captured-patterns
  description: Capture a done run as a pattern that builds later slices of the same kind with no
    model call, prove it, approve, withdraw and erase it.
- name: trial-sets
  description: Build an approved slice several times, reusing nothing, and see how much the builds
    vary.
- name: operations
  description: Follow and cancel long-running work, and list this service's operations.
- name: workers
  description: Step workers announce that they are ready.
paths:
  /slices:
    post:
      tags:
      - slices
      operationId: createSlice
      x-operation-name: Agentic.Engine/slices/write
      summary: Propose a slice from a description
      description: Proposes a slice from the developer's prose. The operation's target is the new slice;
        when it succeeds the slice holds goals, terms, rules, examples, a contract, any questions and
        its check results. An analyst answer that repeats a key is asked for again; after the
        pattern's attempts the operation fails with OperationFailed. At most 4 operations that need
        the analyst (createSlice and answerQuestions) work at once across the engine; any other
        waits, `running`, until one ends, and one cancelled while it waits never calls the analyst.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '409': [IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
        operation: [NarrowDescription, TooManyQuestions, BudgetExhausted]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSliceRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags:
      - slices
      operationId: listSlices
      x-operation-name: Agentic.Engine/slices/read
      summary: List slices
      description: Lists slices, newest first, at most 50 per page.
      security:
      - clientToken: []
      - pageToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '429': [RateLimited]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          $ref: '#/components/responses/SliceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /slices/{sliceId}:
    get:
      tags:
      - slices
      operationId: getSlice
      x-operation-name: Agentic.Engine/slices/read
      summary: Get a slice
      description: Returns the slice with its goals, terms, rules, examples, contract, questions, part
        hashes, approvals, check results and history. Check results produced under another method
        are run again first (`checks_method`).
      security:
      - clientToken: []
      - pageToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '429': [RateLimited]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      responses:
        '200':
          $ref: '#/components/responses/Slice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
      - slices
      operationId: deleteSlice
      x-operation-name: Agentic.Engine/slices/delete
      summary: Delete a slice and its runs
      description: Erases the slice, its run records, their stored artifacts and its trial sets.
        Project folders are left to the developer. Refused with RunActive while one of the slice's
        runs has not ended, and while one of its trial sets is `running` or a `run-trials`
        operation of the slice has not ended. The operation's target is the slice.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/goals:
    put:
      tags:
      - slices
      operationId: replaceGoals
      x-operation-name: Agentic.Engine/slices/write
      summary: Replace a slice's goals
      description: Replaces all goals. The slice's checks run again and the goals approval is withdrawn.
        The operation's target is the slice.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalsPart'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/rules:
    put:
      tags:
      - slices
      operationId: replaceRules
      x-operation-name: Agentic.Engine/slices/write
      summary: Replace a slice's rules, examples and terms
      description: Replaces the rules, the examples and the terms together. The slice's checks run again
        and the rules approval is withdrawn. The operation's target is the slice.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesPart'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/contract:
    put:
      tags:
      - slices
      operationId: replaceContract
      x-operation-name: Agentic.Engine/slices/write
      summary: Replace a slice's contract
      description: Replaces the contract. The slice's checks run again and the contract approval is
        withdrawn. The operation's target is the slice.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractPart'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/answers:
    post:
      tags:
      - slices
      operationId: answerQuestions
      x-operation-name: Agentic.Engine/slices/answers/write
      summary: Answer open questions
      description: Records the developer's answers with the slice. The slice is then revised and checked
        again, and may hold new questions, up to 10 in total. The revision keeps every goal, term,
        rule, example and operation of the slice; a revision that drops or moves one, or an
        answer that repeats a key, is asked for again, and after the pattern's attempts the
        operation fails with OperationFailed and the slice is unchanged. To remove an item, change
        its part. The operation's target is the slice.
        At most 4 operations that need the analyst (createSlice and answerQuestions) work at once
        across the engine; any other waits, `running`, until one ends, and one cancelled while it
        waits never calls the analyst.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [QuestionNotOpen, RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
        operation: [TooManyQuestions, BudgetExhausted]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/approvals:
    post:
      tags:
      - slices
      operationId: approvePart
      x-operation-name: Agentic.Engine/slices/approvals/write
      summary: Approve part of a slice
      description: Approves the goals, the rules (with examples and terms) or the contract at the hash the
        developer reviewed. Refused while the part fails a check, an open question concerns it, the hash
        is stale, or, for the contract, the pattern does not fit. The operation's target is the slice.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [PartFailsChecks, ContradictionOpen, StaleContentHash, PatternDoesNotFit, RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/runs:
    post:
      tags:
      - runs
      operationId: startRun
      x-operation-name: Agentic.Engine/runs/write
      summary: Build an approved slice
      description: >-
        Starts a run that builds the slice into a new project folder. The pattern: with `pattern`,
        that one (the base pattern, or a captured pattern that is usable); without it, the most
        recently approved usable captured pattern that fits the slice, else the base pattern. A
        run of a proof slice (`proof_of`) is a proof: it always uses that captured pattern with
        its source values, in any state but withdrawn, reuses no earlier result, and carries
        `proof: true`. The run (getRun, readable as soon as this answers) and its RunStarted name
        the pattern, `pattern_reason`, and for a captured pattern its parameters' values and
        `source_run`; `not_used` names each captured pattern that fits but needs a new proof, and
        each that did not fit only because of a refused value, with the reason. Refusals come in
        this order, the first that applies; each comes at once, and no operation is created. A
        body that does not match StartRunRequest is InvalidRequest, or InvalidProject when only
        its project name breaks the folder-name rule; then an unknown slice, or a `pattern`
        naming no pattern, is NotFound; then PatternDoesNotFit while the slice fails a pattern
        condition of the base pattern, even when no part is approved; then NotApproved while a
        part is not approved at its current hash; then, for a named captured pattern or a proof
        slice's: CapturedPatternWithdrawn when it is withdrawn; CapturedPatternBusy, for a proof
        only, while another of the captured pattern's operations runs (any other run judges the
        captured pattern by its recorded state and is never refused Busy);
        CapturedPatternNotApproved when a named one is `proposed` or `proven` (a proof slice's
        own run is not refused); ProofRequired when a named approved one is not usable (its
        latest proof did not pass under the current method); PatternDoesNotFit, with the first
        place the slice differs or the value refused and why, when a named captured pattern does
        not fit, and for a proof slice when `pattern` names another pattern or a part no longer
        equals the copy it was made from; then WorkersNotReady while a step of the pattern has no
        ready worker (a `fill` step needs none); then RunActive while any run, of any slice, has
        not ended (at most one active run on the platform, FR-021); then ProjectExists when the
        folder exists. The operation's target is the new run; it lasts until the run ends.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest, InvalidProject]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [NotApproved, PatternDoesNotFit, CapturedPatternWithdrawn, CapturedPatternBusy, CapturedPatternNotApproved, ProofRequired, WorkersNotReady, RunActive, ProjectExists, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /slices/{sliceId}/trial-sets:
    post:
      tags:
      - trial-sets
      operationId: startTrialSet
      x-operation-name: Agentic.Engine/trialSets/write
      summary: Build an approved slice several times
      description: >-
        Accepts a trial set: `trials` fresh builds of the slice (a slice trial each), into the new
        projects `<project_prefix>-1` to `<project_prefix>-<trials>`, run one after another, so
        the developer sees how much the builds vary (TrialSet). Each trial is a run started as
        startRun without `pattern` starts one, into its own project, reusing no accepted result
        of any earlier run (it records no ResultReused), with `trial_set` and `trial` on its
        RunStarted and Run; a trial of a proof slice is a proof. Trial *i* starts only after trial
        *i − 1* has ended; while another run of the platform has not ended, the set waits for it
        rather than failing. A trial that waits for the developer is handed over by the set (its
        reason names the set), and the next starts. Before each trial the set checks, in this
        order, that it was not cancelled; that the set's cost so far plus the trial's own cost
        budget (`budgets.run.cost_usd` of its pattern) is within `x-limits.trial-set-cost-usd`,
        else it ends `stopped` with `budget`; that every part of the slice is still approved at
        the hash it had when the set was accepted (`part_hashes`), else `slice-changed`; that the
        trial's project has a ready worker for every step that needs one, else `workers`. A set
        still running `x-limits.trial-set-hours` after it was accepted cancels its running trial
        and ends `stopped` with `time`. Refusals come in this order, the first that applies; each
        comes at once, nothing is recorded and no trial starts. A body that does not match
        TrialSetRequest (`trials` outside 1 to `x-limits.trials-max`, or a `project_prefix`
        outside its rule) is InvalidRequest; then an unknown slice is NotFound; then, as startRun
        refuses: PatternDoesNotFit, NotApproved, and for a proof slice CapturedPatternWithdrawn
        and CapturedPatternBusy; then WorkersNotReady naming the first project, in trial order,
        and step without a ready worker; then ProjectExists naming the first project whose folder
        exists; then RunActive while another trial set of the slice is `running` or its operation
        has not ended. The operation (kind `run-trials`) targets the set and lasts until the set
        ends: it succeeds when the set ends `ended` or `stopped` and ends `cancelled` when it is
        cancelled. Cancelling it cancels the running trial and starts no other.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [PatternDoesNotFit, NotApproved, CapturedPatternWithdrawn, CapturedPatternBusy, WorkersNotReady, ProjectExists, RunActive, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/SliceId'
