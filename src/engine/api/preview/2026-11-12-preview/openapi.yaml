  /operations/{operationId}/cancel:
    post:
      tags:
      - operations
      operationId: cancelOperation
      x-operation-name: Agentic.Engine/operationStatuses/cancel/action
      summary: Cancel an operation
      description: Stops the operation; it ends `cancelled`. Cancelling a run's operation ends the run with
        the outcome `cancelled`, whether it is running, interrupted or waiting for the developer.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [OperationEnded, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/OperationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /workers:
    post:
      tags:
      - workers
      operationId: registerWorker
      x-operation-name: Agentic.Engine/workers/write
      summary: Register a step worker
      description: Tells the engine that the worker for one step of one slice is ready at `endpoint`. The
        slice and step are those its worker token was issued for. Registering again replaces the
        endpoint. A registration is kept across an engine restart until it is replaced, its worker
        token's grant is removed, or its slice is erased, so the worker need not register again
        after the engine restarts. It returns 404 when that slice no longer exists or the slice's pattern has no such
        step. Unlike other state changes it takes effect at once and returns the registration, not an
        operation, because a worker token cannot follow operations. A run waiting for this slice's
        step workers continues once each of its steps has a registered worker. When the engine cannot
        record the registration durably it answers 503 Unavailable and nothing changed; register
        again after `Retry-After`.
      security:
      - workerToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRegistration'
      responses:
        '200':
          $ref: '#/components/responses/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /providers/Agentic.Engine/operations:
    get:
      tags:
      - operations
      operationId: listProviderOperations
      x-operation-name: Agentic.Engine/operations/read
      summary: List this service's operations
      description: Lists the operations this service offers, by permission name and display text, at
        most 50 per page. It takes no api-version; it holds the `x-operation-name` and `summary` of every
        operation in every version this service serves, as one entry per permission name, whose display
        text is the `summary` of each operation with that name, in contract order, joined by "; ". A
        `page_token` this service did not issue returns 400 InvalidRequest.
      security:
      - clientToken: []
      - pageToken: []
      x-error-codes:
        '400': [InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '429': [RateLimited]
      parameters:
      - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          $ref: '#/components/responses/ProviderOperationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    clientToken:
      type: http
      scheme: bearer
      description: The terminal client's token for this session. It may call every operation except
        registerWorker.
    pageToken:
      type: http
      scheme: bearer
      description: The run page's token for this session. It may call only GET operations.
    workerToken:
      type: http
      scheme: bearer
      description: A step worker's token, issued for one step of one slice. It may call only
        registerWorker.
  parameters:
    ApiVersion:
      name: api-version
      in: query
      required: true
      description: The API version. This contract is 2026-11-12-preview. A missing value returns 400
        MissingApiVersionParameter; any other value returns 400 UnsupportedApiVersionValue.
      schema:
        $ref: slice-defs.schema.json#/$defs/api_version
        examples:
        - 2026-11-12-preview
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Kept for `x-limits.idempotency-key-retention-hours`. Repeating a request with the same key returns the first result; a
        different body with the same key returns 409 IdempotencyKeyReused.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PageToken:
      name: page_token
      in: query
      required: false
      description: The `next_page_token` of the previous page; omit it for the first page. A token
        is bound to the list that issued it and is opaque; one this service did not issue, or one
        issued by another list, returns 400 InvalidRequest. A slice list token names the last slice
        of its page, so slices created or deleted between pages are neither repeated nor make
        another skipped. Tokens do not outlive a restart of the engine.
      schema:
        type: string
        minLength: 1
    SliceId:
      name: sliceId
      in: path
      required: true
      description: The slice's ID.
      schema:
        $ref: slice-defs.schema.json#/$defs/slice_id
    RunId:
      name: runId
      in: path
      required: true
      description: The run's ID.
      schema:
        $ref: slice-defs.schema.json#/$defs/run_id
    CapturedPatternId:
      name: capturedPatternId
      in: path
      required: true
      description: The captured pattern's ID.
      schema:
        $ref: slice-defs.schema.json#/$defs/pattern_id
    TrialSetId:
      name: trialSetId
      in: path
      required: true
      description: The trial set's ID.
      schema:
        $ref: slice-defs.schema.json#/$defs/trial_set_id
    OperationId:
      name: operationId
      in: path
      required: true
      description: The operation's ID.
      schema:
        $ref: slice-defs.schema.json#/$defs/operation_id
    ArtifactHash:
      name: hash
      in: path
      required: true
      description: The artifact's SHA-256, as the run record names it.
      schema:
        $ref: slice-defs.schema.json#/$defs/hash
  headers:
    Deprecation:
      description: When the operation was deprecated (RFC 9745); only on deprecated operations.
      schema:
        type: string
    Sunset:
      description: When the operation stops working (RFC 8594); only on deprecated operations.
      schema:
        type: string
    Link:
      description: A `rel="deprecation"` link to the migration notes; only on deprecated operations.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        minimum: 1
  responses:
    Accepted:
      description: Accepted; follow the operation.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
    Operation:
      description: The operation.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
    Slice:
      description: The slice.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Slice'
    SliceList:
      description: A page of slices.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SliceList'
    CapturedPattern:
      description: The captured pattern.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapturedPattern'
    CapturedPatternList:
      description: A page of captured patterns.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CapturedPatternList'
    TrialSet:
      description: The trial set.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrialSet'
    TrialSetList:
      description: A page of trial sets.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TrialSetList'
    Run:
      description: The run.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Run'
    RunList:
      description: A page of runs.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RunList'
    RunEventList:
      description: A page of the run record.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RunEventList'
    Artifact:
      description: The artifact's content, with the media type it was recorded with as `Content-Type`.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        '*/*':
          schema:
            type: string
            format: binary
    DifferenceList:
      description: A page of differences; empty when the runs match.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DifferenceList'
    Worker:
      description: The registration as the engine holds it.
      headers:
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/Link'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Worker'
    ProviderOperationList:
      description: A page of operations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderOperationList'
    BadRequest:
      description: The request is malformed; `code` and `detail` say what to fix.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: The token is missing or not valid for this session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token is valid but may not call this operation. Where the operation has a 404
        response, a slice, run or step that exists but is not for the caller is reported there as
        not found, the same as one that does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The slice, run, operation, artifact or captured pattern does not exist (an erased
        captured pattern included), or it exists but is not for this slice or step.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Refused in the current state; `code` names why and `failures` lists any failing checks.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: More than `x-limits.requests-per-second-per-token` requests in one second with this token, or more than
        `x-limits.requests-per-second-per-address-without-token` requests without an accepted token from this source address; try again
        after `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: The engine could not record the change durably, so nothing was accepted; send the
        same request again (with the same Idempotency-Key where the operation takes one) after
        `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnavailableProblem'
  schemas:
    ErrorCode:
      type: string
      description: >-
        A stable problem code. InvalidRequest: the body or a parameter does not match this contract.
        MissingApiVersionParameter, UnsupportedApiVersionValue: the api-version is missing or not
        served. Unauthorized, Forbidden: see 401 and 403. NotFound: the resource does not exist.
        RateLimited: more requests in one second than `x-limits.requests-per-second-per-token` with one token, or than
        `x-limits.requests-per-second-per-address-without-token` without an accepted token from one source address. IdempotencyKeyReused: the key was used with a
        different body. NarrowDescription: the description covers more than one use case; describe
        one. TooManyQuestions: the slice would need more than 10 questions; narrow the description.
        QuestionNotOpen: the question does not exist or is answered. ContradictionOpen: an open
        question concerns the part. PartFailsChecks: the part fails a check, listed in `failures`.
        StaleContentHash: the part changed since it was shown. NotApproved: a part is not approved.
        PatternDoesNotFit: the slice fails a pattern condition, listed in `failures`. WorkersNotReady:
        a step of the pattern has no registered worker. RunActive: a run has not ended. ProjectExists:
        the project folder exists. InvalidProject: the project name is not a valid folder name.
        RunNotInterrupted: the run is not interrupted. RunNotWaiting: the run is not waiting for the
        developer. RunNotEnded: the run has not ended. OperationEnded: the operation has finished.
        BudgetExhausted: the work used its token, cost or time budget. RunNotDone: the run has not
        ended `done`; `detail` names its state. RunNotCapturable: the run cannot be captured (a
        run under another base pattern version, a run of a captured pattern, a proof run, or a run
        whose slice changed after it started or that recorded no part hashes); `detail` names the
        cause. CapturedPatternExists: a captured pattern holds the ID, or an erased one held it.
        ParameterRefused: a parameter's value is outside its kind's form, equals another's in a
        case form, does not occur in the slice, or occurs in more than
        `x-limits.parameter-places-max` places; `detail` names the parameter and why.
        ProofRequired: the captured pattern's latest proof did not pass under the current method.
        CapturedPatternWithdrawn: the captured pattern is withdrawn. CapturedPatternBusy: another
        of the captured pattern's operations runs, or a run of its proof slice (for erasure, also a
        run built from it) has not ended. CapturedPatternApproved: the captured pattern is
        approved, so it never changes. CapturedPatternNotApproved: the named captured pattern is
        `proposed` or `proven`. OperationFailed: the work
        failed for a reason no other code names, after any retries; `detail` says why. A 503
        answer has its own problem, UnavailableProblem, whose code is always Unavailable.
      enum:
      - InvalidRequest
      - MissingApiVersionParameter
      - UnsupportedApiVersionValue
      - Unauthorized
      - Forbidden
      - NotFound
      - RateLimited
      - IdempotencyKeyReused
      - NarrowDescription
      - TooManyQuestions
      - QuestionNotOpen
      - ContradictionOpen
      - PartFailsChecks
      - StaleContentHash
      - NotApproved
      - PatternDoesNotFit
      - WorkersNotReady
      - RunActive
      - ProjectExists
      - InvalidProject
      - RunNotInterrupted
      - RunNotWaiting
      - RunNotEnded
      - OperationEnded
      - BudgetExhausted
      - OperationFailed
      - RunNotDone
      - RunNotCapturable
      - CapturedPatternExists
      - ParameterRefused
      - ProofRequired
      - CapturedPatternWithdrawn
      - CapturedPatternBusy
      - CapturedPatternApproved
      - CapturedPatternNotApproved
    Problem:
      type: object
      description: An RFC 9457 problem with a stable `code`.
      required:
      - type
      - title
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        failures:
          type: array
          description: Each failing check, naming the part and the reason.
          items:
            $ref: '#/components/schemas/CheckResult'
        supported_versions:
          type: array
          description: With UnsupportedApiVersionValue, the api-versions this service serves.
          items:
            type: string
    UnavailableProblem:
      type: object
      description: An RFC 9457 problem for a 503 answer; its `code` is always Unavailable. It is kept
        apart from Problem so that the codes every other answer may carry stay as they were.
      required:
      - type
      - title
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          const: Unavailable
    CheckResult:
      $ref: slice-defs.schema.json#/$defs/check_result
    Slice:
      $ref: slice.schema.json
    RunEvent:
      $ref: run-event.schema.json
    GoalsPart:
      $ref: slice-defs.schema.json#/$defs/goals_part
    RulesPart:
      $ref: slice-defs.schema.json#/$defs/rules_part
    ContractPart:
      $ref: slice-defs.schema.json#/$defs/contract_part
    CreateSliceRequest:
      type: object
      required:
      - description
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 4000
          description: The developer's prose about one use case, at most 4000 characters.
    Answer:
      type: object
      required:
      - question
      - answer
      additionalProperties: false
      properties:
        question:
          $ref: slice-defs.schema.json#/$defs/question_id
        answer:
          $ref: slice-defs.schema.json#/$defs/answer
    AnswerRequest:
      type: object
      required:
      - answers
      additionalProperties: false
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 10
          description: One answer per open question. An `option` must be one of the question's options.
          items:
            $ref: '#/components/schemas/Answer'
    ApprovalRequest:
      type: object
      required:
      - part
      - content_hash
      additionalProperties: false
      properties:
        part:
          $ref: slice-defs.schema.json#/$defs/part
        content_hash:
          $ref: slice-defs.schema.json#/$defs/hash
          description: The part's hash as the developer reviewed it, from the slice's `parts`.
    RunRequest:
      type: object
      required:
      - project
      additionalProperties: false
      properties:
        project:
          $ref: slice-defs.schema.json#/$defs/project_name
          description: The name of the new project folder, created under the projects folder chosen when
            the platform started. It must not exist yet.
    StartRunRequest:
      type: object
      required:
      - project
      additionalProperties: false
      properties:
        project:
          $ref: slice-defs.schema.json#/$defs/project_name
          description: The name of the new project folder, created under the projects folder chosen when
            the platform started. It must not exist yet.
        pattern:
          $ref: slice-defs.schema.json#/$defs/pattern_id
          description: The pattern to build with, the base pattern's ID or a captured pattern's. Without
            it the most recently approved usable captured pattern that fits the slice is used, else
            the base pattern (startRun).
    CaptureRequest:
      type: object
      required:
      - run
      additionalProperties: false
      properties:
        run:
          $ref: slice-defs.schema.json#/$defs/run_id
          description: The run to capture; it must have ended `done`.
        name:
          $ref: slice-defs.schema.json#/$defs/capture_name
          description: The captured pattern's name; its ID is `<base pattern id>-<name>`. Without it, the
            run's slice ID in lowercase (`s-3`).
    ParameterValueRequest:
      type: object
      required:
      - name
      - value
      additionalProperties: false
      properties:
        name:
          $ref: slice-defs.schema.json#/$defs/parameter_name
        value:
          $ref: slice-defs.schema.json#/$defs/parameter_value
          description: The source value, as it occurs in the source slice.
    ParametersRequest:
      type: object
      required:
      - parameters
      additionalProperties: false
      properties:
        parameters:
          type: array
          maxItems: 32
          description: Every parameter the captured pattern keeps, at most
            `x-limits.captured-pattern-parameters-max`; empty leaves none, so only a slice identical
            to the source fits.
          items:
            $ref: '#/components/schemas/ParameterValueRequest'
    CapturedPatternState:
      type: string
      description: >-
        `proposed` until a proof with the current parameters passes; `proven` after one passed
        (every accepted replaceParameters, and a failing proof, move it back to `proposed`);
        `approved` once the developer approved it after a passing proof (it never changes again;
        a new proof may run at any time); `withdrawn` once withdrawn, final.
      enum:
      - proposed
      - proven
      - approved
      - withdrawn
    ParameterKind:
      type: string
      description: >-
        The form every value of the parameter takes, the source's and a later slice's. `name`:
        `[a-z][a-z0-9]*` with at least two letters, its lowercase form; it covers that form, the
        capitalised form and the uppercase form, each replaced wherever it occurs, inside longer
        words too (a plural is its own parameter, and any other spelling, such as `nOTE`, is not
        replaced). `number`: an integer or a decimal without a sign, matched only as a whole number
        (the characters around it are not digits, letters or `_`, and not a `.` followed by a
        digit). `string`: letters, digits, `_`, `-` and spaces.
      enum:
      - name
      - number
      - string
    ParameterSource:
      type: string
      description: Where the value came from in the source slice. `name`, one of its names (a schema
        property name, or a word of an operation ID or schema name split at case changes);
        `declared-value`, a value its contract declares; `literal`, any other number or string
        that occurs in it.
      enum:
      - name
      - declared-value
      - literal
    ParameterPlace:
      type: object
      description: One place a parameter's value occurs, found longest value first, left to right,
        never overlapping another place.
      required:
      - part
      - in
      - line
      - column
      - form
      additionalProperties: false
      properties:
        part:
          type: string
          minLength: 1
          description: '`slice/goals`, `slice/rules` or `slice/contract` for an approved part of the
            source slice, as its canonical JSON; otherwise the path of a template file, relative to
            the project folder.'
        in:
          type: string
          enum:
          - content
          - path
          description: Whether the place is in the part's or file's content, or in the file's path.
        line:
          type: integer
          minimum: 1
          description: The line, from 1; 1 for a place in a path.
        column:
          type: integer
          minimum: 1
          description: The column in characters, from 1, in the line or in the path.
        form:
          type: string
          enum:
          - lower
          - capitalised
          - upper
          - exact
          description: The case form that occurs there; `exact` for a number or a string.
    Parameter:
      type: object
      required:
      - name
      - kind
      - value
      - source
      - origin
      - places
      additionalProperties: false
      properties:
        name:
          $ref: slice-defs.schema.json#/$defs/parameter_name
        kind:
          $ref: '#/components/schemas/ParameterKind'
        value:
          $ref: slice-defs.schema.json#/$defs/parameter_value
          description: The source value.
        source:
          $ref: '#/components/schemas/ParameterSource'
        origin:
          type: string
          enum:
          - proposed
          - added
          description: '`proposed` by the capture; `added` by the developer with replaceParameters.'
        places:
          type: array
          minItems: 1
          maxItems: 10000
          description: Every place the value occurs, at most `x-limits.parameter-places-max`, in the
            order found.
          items:
            $ref: '#/components/schemas/ParameterPlace'
    ProofFailure:
      type: object
      description: >-
        Why a proof failed: a failing check (`step`, `check`), a filled file that differs from the
        template (`step`, `path`), or the run's end other than `done` (`reason` only).
      required:
      - reason
      additionalProperties: false
      properties:
        step:
          $ref: slice-defs.schema.json#/$defs/step_name
        check:
          $ref: slice-defs.schema.json#/$defs/check_name
        path:
          type: string
          minLength: 1
          description: Path relative to the project folder.
        reason:
          type: string
          minLength: 1
    Proof:
      type: object
      description: >-
        One proof: a run of the captured pattern's proof slice under the captured pattern with the
        source values, reusing no earlier result. It is `running` from its RunStarted until its
        run is handed over or ends; then `passed` when the run ended `done` and its `tests`,
        `code` and `witnesses` outputs' hashes equal the template's (generated code is judged by
        its checks, not compared), otherwise `failed`, naming each failing check, each differing
        file, or the run's end (`expired`, `cancelled`); a hand-over fails it at once, while the
        run waits for the developer. Only an interrupted run leaves it `running`. It makes the
        captured pattern `proven`, and counts for approval, only while its `parameters` equal the
        current ones.
      required:
      - run
      - method
      - outcome
      - failures
      - parameters
      additionalProperties: false
      properties:
        run:
          $ref: slice-defs.schema.json#/$defs/run_id
          description: The proof's run; after the proof slice is erased, getRun answers NotFound for it.
        method:
          $ref: slice-defs.schema.json#/$defs/hash
          description: The method identity the proof ran under.
        outcome:
          type: string
          enum:
          - running
          - passed
          - failed
        failures:
          type: array
          description: Empty unless `failed`.
          items:
            $ref: '#/components/schemas/ProofFailure'
        parameters:
          $ref: slice-defs.schema.json#/$defs/parameter_values
          description: The parameters' names and source values it proved.
    CapturedPatternApproval:
      type: object
      required:
      - by
      - at
      - proof
      additionalProperties: false
      properties:
        by:
          type: string
          const: client
          description: The developer's client token, the only caller that may approve.
        at:
          type: string
          format: date-time
        proof:
          $ref: slice-defs.schema.json#/$defs/run_id
          description: The run of the passing proof it approved.
    CapturedPattern:
      type: object
      description: >-
        A pattern captured from a run that ended `done`: its base pattern with each agent step's
        worker replaced by the fixed procedure `fill`, which writes the source run's accepted
        files with each parameter's value in its place, so it builds a slice that fits it with no
        model call. A slice fits when filling the source slice's approved parts with one value
        per parameter gives exactly that slice's approved parts. It is used only while `usable`.
      required:
      - id
      - version
      - base
      - method
      - source
      - parts
      - template
      - parameters
      - proofs
      - state
      - usable
      - created_at
      additionalProperties: false
      properties:
        id:
          $ref: slice-defs.schema.json#/$defs/pattern_id
          description: '`<base pattern id>-<name>`.'
        version:
          type: string
          const: 1.0.0
          description: Always `1.0.0`; a captured pattern never changes, and a change is a new capture.
        base:
          $ref: slice-defs.schema.json#/$defs/pattern_ref
          description: The base pattern it was captured from, the engine's at capture.
        method:
          $ref: slice-defs.schema.json#/$defs/hash
          description: >-
            The engine's method identity at capture; the method that accepted each of the source
            run's steps is on that run's events.
        source:
          type: object
          required:
          - run
          - slice
          additionalProperties: false
          description: The run it was captured from and that run's slice; both are kept named after
            they are erased.
          properties:
            run:
              $ref: slice-defs.schema.json#/$defs/run_id
            slice:
              $ref: slice-defs.schema.json#/$defs/slice_id
        parts:
          $ref: slice-defs.schema.json#/$defs/part_hashes
          description: The hashes of the source slice's approved parts it holds a copy of, kept when
            the source slice is erased.
        template:
          type: object
          required:
          - tests
          - code
          - witnesses
          additionalProperties: false
          description: Per filled output, the artifact hash of the files the source run's project
            ended with (the step's last acceptance or reuse, after any review round's fix).
          properties:
            tests:
              $ref: slice-defs.schema.json#/$defs/hash
            code:
              $ref: slice-defs.schema.json#/$defs/hash
            witnesses:
              $ref: slice-defs.schema.json#/$defs/hash
        proof_slice:
          $ref: slice-defs.schema.json#/$defs/slice_id
          description: Its proof slice (makeProofSlice); absent until the first one is made and after
            it is erased.
        parameters:
          type: array
          maxItems: 32
          description: Its parameters, at most `x-limits.captured-pattern-parameters-max`; empty when
            it has none, so only a slice identical to the source fits.
          items:
            $ref: '#/components/schemas/Parameter'
        proofs:
          type: array
          description: Every proof, newest last, kept after its run is erased.
          items:
            $ref: '#/components/schemas/Proof'
        approval:
          $ref: '#/components/schemas/CapturedPatternApproval'
        state:
          $ref: '#/components/schemas/CapturedPatternState'
        usable:
          type: boolean
          description: True while it is `approved` and its latest proof passed under the engine's
            current method; only a usable captured pattern is chosen by startRun. A method change,
            a later failing proof, or a proof still running makes it unusable until a new proof
            passes.
        created_at:
          type: string
          format: date-time
    CapturedPatternList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CapturedPattern'
        next_page_token:
          type: string
    WorkerRegistration:
      type: object
      required:
      - endpoint
      additionalProperties: false
      properties:
        endpoint:
          $ref: slice-defs.schema.json#/$defs/worker_endpoint
          description: >-
            The worker's base address on the internal network: `http://`, a host name of lowercase
            letters, digits and hyphens (such as its Compose service name), a port, and nothing
            after an optional `/`.
        project:
          $ref: slice-defs.schema.json#/$defs/project_name
          description: >-
            The project the worker's container serves. The engine keeps one registration per
            slice, step and project, and a run calls only its own project's workers; a registration
            without a project serves any project of its slice, used only when the project has none
            of its own. Registering again for the same slice, step and project replaces the
            endpoint.
    Worker:
      type: object
      required:
      - slice
      - step
      - endpoint
      properties:
        slice:
          $ref: slice-defs.schema.json#/$defs/slice_id
        step:
          $ref: slice-defs.schema.json#/$defs/step_name
        endpoint:
          $ref: slice-defs.schema.json#/$defs/worker_endpoint
          description: The registered base address, as `WorkerRegistration.endpoint` defines it.
        project:
          $ref: slice-defs.schema.json#/$defs/project_name
          description: The project it serves, as registered; absent for a registration without one.
    OperationKind:
      type: string
      description: What the operation does. Resuming, replaying and handing over a run all use the kind
        `run`; a proof is a run. `run-trials` runs a trial set; each of its trials also has its own
        `run` operation.
      enum:
      - propose-slice
      - answer-questions
      - replace-goals
      - replace-rules
      - replace-contract
      - approve-part
      - delete-slice
      - run
      - capture-run
      - replace-parameters
      - make-proof-slice
      - approve-captured-pattern
      - withdraw-captured-pattern
      - erase-captured-pattern
      - run-trials
    OperationStatus:
      type: string
      enum:
      - accepted
      - running
      - succeeded
      - failed
      - cancelled
    Operation:
      type: object
      description: Long-running work. A `run` operation lasts from the start of its run until the run
        ends, and succeeds whatever the run's outcome, except `cancelled`; the outcome is on the run.
        When the platform could not carry the run on, the operation fails with the run's reason. A
        `run-trials` operation lasts from the acceptance of its trial set until the set ends; it
        succeeds when the set ends `ended` or `stopped`, whatever its trials' outcomes, and ends
        `cancelled` when the set is cancelled; the outcomes are on the set.
      required:
      - id
      - kind
      - status
      - target
      - created_at
      - updated_at
      properties:
        id:
          $ref: slice-defs.schema.json#/$defs/operation_id
        kind:
          $ref: '#/components/schemas/OperationKind'
        status:
          $ref: '#/components/schemas/OperationStatus'
        target:
          $ref: slice-defs.schema.json#/$defs/operation_target
          description: The slice, run, captured pattern or trial set the operation concerns.
        progress:
          type: object
          description: For a `run` operation, how many of the pattern's steps are accepted.
          required:
          - done
          - total
          properties:
            done:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 1
            step:
              type: string
              description: The step in progress.
        result:
          type: object
          description: Set when the operation succeeded. `slice` is the slice it created or changed (for
            makeProofSlice, the proof slice), `run` the run it started or continued, `reused_slice`
            an existing slice with the same description, returned instead of a new one,
            `captured_pattern` the captured pattern a captured-pattern operation created or
            changed, and `trial_set` the trial set a `run-trials` operation ran.
          minProperties: 1
          maxProperties: 1
          additionalProperties: false
          properties:
            slice:
              $ref: slice-defs.schema.json#/$defs/slice_id
            run:
              $ref: slice-defs.schema.json#/$defs/run_id
            reused_slice:
              $ref: slice-defs.schema.json#/$defs/slice_id
            captured_pattern:
              $ref: slice-defs.schema.json#/$defs/pattern_id
            trial_set:
              $ref: slice-defs.schema.json#/$defs/trial_set_id
        error:
          $ref: '#/components/schemas/Problem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SliceSummary:
      type: object
      required:
      - id
      - title
      - state
      properties:
        id:
          $ref: slice-defs.schema.json#/$defs/slice_id
        title:
          type: string
        state:
          $ref: slice.schema.json#/properties/state
        latest_run:
          $ref: slice-defs.schema.json#/$defs/run_id
        proof_of:
          $ref: slice.schema.json#/properties/proof_of
    SliceList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SliceSummary'
        next_page_token:
          type: string
    RunStatus:
      type: string
      description: >-
        `running`; `interrupted` while the run waits for the developer because the model was
        unavailable on every attempt of a step (resume it with resumeRun), or for its step workers
        (it continues by itself once they register; resumeRun answers WorkersNotReady until then); a
        platform stop alone leaves a run `running`, and it continues by itself once the platform is
        up again;
        `waiting-for-developer` when a step or review ran out of attempts or the budget ran out, with
        the reason; `ended`, with an outcome.
      enum:
      - running
      - interrupted
      - waiting-for-developer
      - ended
    RunWaitsFor:
      type: string
      description: >-
        Set exactly while the run is `interrupted`, saying what it continues on: `resume` when it
        continues only on resumeRun (the model was unavailable on every attempt of a step);
        `step-workers` when it continues by itself once the step workers of its slice register
        (resumeRun answers WorkersNotReady until then).
      enum:
      - resume
      - step-workers
    RunOutcome:
      type: string
      description: >-
        `done` when every step is accepted; `handed-over` when the developer accepted the hand-over;
        `expired` when the run waited 14 days for the developer; `cancelled` when its operation was
        cancelled, or when the platform could not carry the run on (its `RunCancelled` detail
        begins `the run's workflow failed:` and says why; its operation then fails).
      enum:
      - done
      - handed-over
      - expired
      - cancelled
    Run:
      type: object
      if:
        required:
        - status
        properties:
          status:
            const: ended
      then:
        required:
        - outcome
        - ended_at
      else:
        not:
          anyOf:
          - required:
            - outcome
          - required:
            - ended_at
      dependentRequired:
        trial_set:
        - trial
        trial:
        - trial_set
      required:
      - id
      - slice
      - pattern
      - project
      - status
      - operation
      - created_at
      - updated_at
      properties:
        id:
          $ref: slice-defs.schema.json#/$defs/run_id
        slice:
          $ref: slice-defs.schema.json#/$defs/slice_id
        pattern:
          $ref: slice-defs.schema.json#/$defs/pattern_ref
          description: Pattern ID and version, as `<id>@<version>`, a base pattern or a captured pattern.
        project:
          $ref: slice-defs.schema.json#/$defs/project_name
          description: The project folder's name under the projects folder.
        status:
          $ref: '#/components/schemas/RunStatus'
        outcome:
          $ref: '#/components/schemas/RunOutcome'
        reason:
          type: string
          description: Why the run waits for the developer, or why it ended other than `done`.
        waits_for:
          $ref: '#/components/schemas/RunWaitsFor'
        expires_at:
          type: string
          format: date-time
          description: While the run is interrupted or waiting for the developer, when it ends `expired`
            (14 days after it stopped).
        operation:
          $ref: slice-defs.schema.json#/$defs/operation_id
          description: The run's operation.
        replay_of:
          $ref: slice-defs.schema.json#/$defs/run_id
          description: For a replay, the run it replays.
        proof:
          type: boolean
          const: true
          description: True for a proof of a captured pattern (a run of its proof slice); absent on
            every other run.
        pattern_reason:
          $ref: slice-defs.schema.json#/$defs/pattern_reason
          description: Why the run uses `pattern`, from its RunStarted; absent on runs started before
            captured patterns existed.
        parameters:
          $ref: slice-defs.schema.json#/$defs/parameter_values
          description: For a run of a captured pattern, each parameter's value in this run.
        source_run:
          $ref: slice-defs.schema.json#/$defs/run_id
          description: For a run of a captured pattern, the run it was captured from.
        not_used:
          $ref: slice-defs.schema.json#/$defs/not_used
          description: The captured patterns the start judged and did not use, with the reason; absent
            when there are none.
        trial_set:
          $ref: slice-defs.schema.json#/$defs/trial_set_id
          description: For a slice trial, the trial set it belongs to, from its RunStarted; absent on
            every other run.
        trial:
          $ref: slice-defs.schema.json#/$defs/trial_number
          description: For a slice trial, its position in the set, from its RunStarted; present
            exactly when `trial_set` is.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Set with `outcome` when the run ends.
    RunList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        next_page_token:
          type: string
    RunEventList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        next_page_token:
          type: string
    Difference:
      type: object
      required:
      - step
      - field
      properties:
        step:
          $ref: slice-defs.schema.json#/$defs/step_name
        field:
          type: string
          enum:
          - artifacts
          - checks
          - decision
        left:
          type: string
          description: >-
            The value in this run, as text: for `artifacts`, the content hash; for `checks`,
            `passed` or `failed: <reason>`; for `decision`, its JSON text. Absent when this run has
            no value for the step and field (for example, it never reached the step).
        right:
          type: string
          description: The value in the other run, in the same form as `left`, and absent in the
            same case.
    DifferenceList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Difference'
        next_page_token:
          type: string
    TrialSetRequest:
      type: object
      required:
      - project_prefix
      additionalProperties: false
      properties:
        project_prefix:
          $ref: slice-defs.schema.json#/$defs/project_prefix
          description: Trial *i* builds into the new project folder `<project_prefix>-<i>` under the
            projects folder chosen when the platform started; none of them may exist yet.
        trials:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: How many trials, 1 to `x-limits.trials-max`; `x-limits.trials-default` when
            not given.
    TrialSetState:
      type: string
      description: >-
        `running` while a trial runs, or the set waits for another run to end or for an
        interrupted trial; `ended` when all its trials ended; `cancelled` when its operation was
        cancelled (the running trial was cancelled and none started after); `stopped` when no
        further trial could start, for the reason in `stopped_because`.
      enum:
      - running
      - ended
      - cancelled
      - stopped
    TrialSetStopReason:
      type: string
      description: >-
        Why a set `stopped`: `budget` when the next trial's own cost budget would take the set's
        cost past `x-limits.trial-set-cost-usd`; `time` when `x-limits.trial-set-hours` passed
        (its running trial was cancelled); `slice-changed` when a part of the slice is no longer
        approved, or differs from the set's `part_hashes`; `workers` when the next trial's project
        has no ready worker for a step that needs one.
      enum:
      - budget
      - time
      - slice-changed
      - workers
    TrialSet:
      type: object
      description: >-
        A trial set: `trials` fresh builds of one approved slice, run one after another, and their
        result. Kept in its slice's records and erased with the slice; it holds nothing beyond its
        trials' run records and its own settings.
      allOf:
      - if:
          properties:
            state:
              const: stopped
        then:
          required:
          - stopped_because
        else:
          not:
            required:
            - stopped_because
      - if:
          properties:
            state:
              const: running
        then:
          not:
            required:
            - ended_at
        else:
          required:
          - ended_at
      required:
      - id
      - slice
      - trials
      - project_prefix
      - method
      - part_hashes
      - budget
      - operation
      - state
      - runs
      - result
      - created_at
      properties:
        id:
          $ref: slice-defs.schema.json#/$defs/trial_set_id
        slice:
          $ref: slice-defs.schema.json#/$defs/slice_id
        trials:
          type: integer
          minimum: 1
          maximum: 5
          description: How many trials the set has, k.
        project_prefix:
          $ref: slice-defs.schema.json#/$defs/project_prefix
          description: Trial *i*'s project is `<project_prefix>-<i>`.
        method:
          $ref: slice-defs.schema.json#/$defs/hash
          description: The engine's method identity when the set was accepted.
        part_hashes:
          $ref: slice-defs.schema.json#/$defs/part_hashes
          description: The slice's approved part hashes when the set was accepted; each trial starts
            only while the slice's parts are approved at these hashes.
        budget:
          type: object
          required:
          - cost_usd
          - hours
          additionalProperties: false
          description: The set's own budget, on top of each run's budgets.
          properties:
            cost_usd:
              type: number
              exclusiveMinimum: 0
              description: '`x-limits.trial-set-cost-usd` when the set was accepted.'
            hours:
              type: integer
              minimum: 1
              description: '`x-limits.trial-set-hours` when the set was accepted.'
        operation:
          $ref: slice-defs.schema.json#/$defs/operation_id
          description: The set's `run-trials` operation.
        state:
          $ref: '#/components/schemas/TrialSetState'
        stopped_because:
          $ref: '#/components/schemas/TrialSetStopReason'
        runs:
          type: array
          description: The trials' run IDs in trial order, each recorded before its run starts; a
            trial not started yet has none.
          items:
            $ref: slice-defs.schema.json#/$defs/run_id
        result:
          $ref: '#/components/schemas/TrialResult'
        created_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: When the set ended; set exactly when `state` is not `running`.
    TrialSetList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrialSet'
        next_page_token:
          type: string
    TrialMeasures:
      type: object
      additionalProperties: false
      description: >-
        What one trial, or one step of it, used. `attempts`: its AttemptMade events plus each
        StepRejected with `usage` and no AttemptMade; `review_rounds`: the highest `round`;
        `seconds`: for a step, the sum of its attempt spans (StepStarted to its StepAccepted or
        StepRejected), for a trial, RunStarted to its end, either without the time the run was
        interrupted (RunInterrupted to RunResumed); `tokens` and `cost_usd`: the sum of `usage`. A
        measure its record does not carry is absent ("not available"), never 0.
      properties:
        attempts:
          type: integer
          minimum: 0
        review_rounds:
          type: integer
          minimum: 0
        seconds:
          type: number
          minimum: 0
        tokens:
          type: integer
          minimum: 0
        cost_usd:
          type: number
          minimum: 0
    Spread:
      type: object
      required:
      - lowest
      - median
      - highest
      additionalProperties: false
      description: The lowest, median and highest of one measure over the trials that carry it; the
        median of an even count is the mean of the two middle values.
      properties:
        lowest:
          type: number
        median:
          type: number
        highest:
          type: number
    MeasureSpreads:
      type: object
      additionalProperties: false
      description: Each measure of TrialMeasures as a Spread over the trials that carry it; absent
        ("not available") when none does.
      properties:
        attempts:
          $ref: '#/components/schemas/Spread'
        review_rounds:
          $ref: '#/components/schemas/Spread'
        seconds:
          $ref: '#/components/schemas/Spread'
        tokens:
          $ref: '#/components/schemas/Spread'
        cost_usd:
          $ref: '#/components/schemas/Spread'
    TrialOutcome:
      type: object
      required:
      - trial
      - run
      - totals
      additionalProperties: false
      description: One started trial.
      properties:
        trial:
          $ref: slice-defs.schema.json#/$defs/trial_number
        run:
          $ref: slice-defs.schema.json#/$defs/run_id
        outcome:
          $ref: '#/components/schemas/RunOutcome'
          description: The run's outcome; absent while it has not ended.
        method:
          $ref: slice-defs.schema.json#/$defs/hash
          description: The method identity on its step events; absent when they carry none.
        totals:
          $ref: '#/components/schemas/TrialMeasures'
    StepFiles:
      type: object
      required:
      - same
      - groups
      additionalProperties: false
      description: >-
        Whether the step's accepted files (the `artifacts` of its last StepAccepted or
        ResultReused) are the same in every trial that accepted it. `groups` holds the trials by
        equal files, in order of their first trial, one group when `same`.
      properties:
        same:
          type: boolean
        groups:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - trials
            additionalProperties: false
            properties:
              trials:
                type: array
                minItems: 1
                items:
                  $ref: slice-defs.schema.json#/$defs/trial_number
    StepSpread:
      type: object
      required:
      - step
      - reached
      - measures
      additionalProperties: false
      description: One step of the pattern, over the trials whose record has it.
      properties:
        step:
          $ref: slice-defs.schema.json#/$defs/step_name
        reached:
          type: integer
          minimum: 0
          description: How many trials' records have the step.
        measures:
          $ref: '#/components/schemas/MeasureSpreads'
        files:
          $ref: '#/components/schemas/StepFiles'
          description: Absent when no trial accepted the step.
    TrialComparison:
      type: object
      required:
      - trial_set
      - method
      - done
      - ended
      - share_change
      - less_reliable
      - methods_differ
      additionalProperties: false
      description: >-
        This set against the slice's previous one: the latest earlier set of the slice that
        `ended` or `stopped` with at least one ended trial.
      properties:
        trial_set:
          $ref: slice-defs.schema.json#/$defs/trial_set_id
        method:
          $ref: slice-defs.schema.json#/$defs/hash
          description: The previous set's method.
        done:
          type: integer
          minimum: 0
        ended:
          type: integer
          minimum: 1
        share_change:
          type: number
          minimum: -1
          maximum: 1
          description: This set's `done`/`ended` minus the previous set's.
        less_reliable:
          type: boolean
          description: True exactly when `share_change` is below 0.
        methods_differ:
          type: boolean
          description: True when the two sets' methods differ.
    TrialResult:
      type: object
      required:
      - ended
      - done
      - unstable
      - methods_mixed
      - outcomes
      - steps
      - totals
      additionalProperties: false
      description: >-
        What the set's trials show together, computed from their run records on each read, never
        stored.
      properties:
        ended:
          type: integer
          minimum: 0
          description: Trials that ended.
        done:
          type: integer
          minimum: 0
          description: Of those, trials that ended `done`; a cancelled, expired or handed-over trial
            is not done.
        unstable:
          type: boolean
          description: True exactly when at least one trial ended `done` and at least one ended
            otherwise.
        methods_mixed:
          type: boolean
          description: True when the trials' runs ran under more than one method; the counts stay
            over all trials.
        outcomes:
          type: array
          description: One per started trial, in trial order.
          items:
            $ref: '#/components/schemas/TrialOutcome'
        steps:
          type: array
          description: One per step of the pattern, in step order; a step no trial reached has
            `reached` 0 and no measures.
          items:
            $ref: '#/components/schemas/StepSpread'
        totals:
          $ref: '#/components/schemas/MeasureSpreads'
          description: Each measure of the trials' totals as a Spread.
        previous:
          $ref: '#/components/schemas/TrialComparison'
          description: Only on a set that `ended` or `stopped`; absent when the slice has no
            previous set.
    ProviderOperation:
      type: object
      required:
      - name
      - display
      properties:
        name:
          type: string
          pattern: ^Agentic\.Engine/[A-Za-z/]+/(read|write|delete|action)$
          description: The permission name, for example `Agentic.Engine/slices/read`.
        display:
          type: string
          description: The `summary` of each operation with this permission name, in contract order,
            joined by "; ".
    ProviderOperationList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderOperation'
        next_page_token:
          type: string
