        each that differs is put back, recorded as one `changed` history entry whose `refs` name
        exactly the restored parts, and then every part that is not approved is approved after
        the part checks pass, one `approved` entry each; an unchanged, approved slice gets no new
        entry. So asking again always gives a slice equal to the copy, with the same slice ID. A
        part that fails a check fails the operation with PartFailsChecks, listing the failures,
        and makes or changes no slice. A proof is then `startRun` of that slice into a new project
        folder. Refused at once with CapturedPatternWithdrawn for a withdrawn one and
        CapturedPatternBusy while another of its operations runs; a restore that would change a
        part while a run of the proof slice has not ended also answers CapturedPatternBusy
        (asking with nothing to restore is then allowed), at once, or as the operation's error
        when a part changed after the request was accepted; allowed in every other state. The operation's
        target is the captured pattern; its result's `slice` is the proof slice.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [CapturedPatternWithdrawn, CapturedPatternBusy, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
        operation: [PartFailsChecks, CapturedPatternBusy]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/CapturedPatternId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /captured-patterns/{capturedPatternId}/approval:
    post:
      tags:
      - captured-patterns
      operationId: approveCapturedPattern
      x-operation-name: Agentic.Engine/capturedPatterns/approval/write
      summary: Approve a proven captured pattern
      description: >-
        Approves a `proven` captured pattern whose latest proof passed under the engine's current
        method, with parameters equal to its current ones; the approval records `by` (`client`),
        `at` and the proof it approved, and the captured pattern is `approved` from then on.
        Approving an approved one changes nothing, whatever its proofs. Refused at once with
        ProofRequired for a `proposed` one or one whose latest proof did not pass under the
        current method, CapturedPatternWithdrawn for a withdrawn one, and CapturedPatternBusy
        while another of its operations runs. The operation's target is the captured pattern.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [ProofRequired, CapturedPatternWithdrawn, CapturedPatternBusy, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/CapturedPatternId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /captured-patterns/{capturedPatternId}/withdrawal:
    post:
      tags:
      - captured-patterns
      operationId: withdrawCapturedPattern
      x-operation-name: Agentic.Engine/capturedPatterns/withdrawal/action
      summary: Withdraw a captured pattern
      description: >-
        Stops the captured pattern's use by new runs, in any state; `withdrawn` is final, and
        only erasure follows. A run already started on it finishes on it, and earlier runs'
        records keep naming it. Withdrawing a withdrawn one changes nothing. Refused at once with
        CapturedPatternBusy while another of its operations runs. The operation's target is the
        captured pattern.
      security:
      - clientToken: []
      x-error-codes:
        '400': [MissingApiVersionParameter, UnsupportedApiVersionValue, InvalidRequest]
        '401': [Unauthorized]
        '403': [Forbidden]
        '404': [NotFound]
        '409': [CapturedPatternBusy, IdempotencyKeyReused]
        '429': [RateLimited]
        '503': [Unavailable]
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/CapturedPatternId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /operations/{operationId}:
    get:
      tags:
      - operations
      operationId: getOperation
      x-operation-name: Agentic.Engine/operationStatuses/read
      summary: Follow a long-running operation
      description: Returns the operation's status, its progress and, when it has finished, its result or
