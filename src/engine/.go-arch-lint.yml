# Module boundaries of src/engine (T098; research D40, ADR 0043): every package is one component with
# its exact folder, and may import only the components (mayDependOn) and vendor packages
# (canUse) listed here; any other import, and any package no component maps, fails
# scripts/check.sh --only arch. Changing this file needs the owner's Approved-by.
version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: false
excludeFiles:
  - "^.*/testdata/.*$"
vendors:
  check-api-gen:
    in: [github.com/agentic-platform/check/api/gen]
  gherkin:
    in: [github.com/cucumber/gherkin/go/v42]
  jsonschema:
    in: [github.com/santhosh-tekuri/jsonschema/v6, github.com/santhosh-tekuri/jsonschema/v6/kind]
  kin-openapi:
    in: [github.com/getkin/kin-openapi/openapi3]
  messages:
    in: [github.com/cucumber/messages/go/v34]
  modfile:
    in: [golang.org/x/mod/modfile]
  oapi-runtime:
    in: [github.com/oapi-codegen/runtime]
  oasdiff:
    in: [github.com/oasdiff/oasdiff/checker, github.com/oasdiff/oasdiff/diff, github.com/oasdiff/oasdiff/load]
  retry-module:
    in: [github.com/agentic-platform/retry]
  slice-module:
    in: [github.com/agentic-platform/slice]
  temporal:
    in: [go.temporal.io/sdk/activity, go.temporal.io/sdk/client, go.temporal.io/sdk/temporal, go.temporal.io/sdk/worker,
      go.temporal.io/sdk/workflow, go.temporal.io/api/enums/v1, go.temporal.io/api/serviceerror,
      go.temporal.io/api/workflowservice/v1, go.temporal.io/api/common/v1, google.golang.org/protobuf/types/known/durationpb]
  temporal-testsuite: # Temporal's test environment, and the logger and interceptor its rigs set
    in: [go.temporal.io/sdk/testsuite, go.temporal.io/sdk/log, go.temporal.io/sdk/interceptor]
  yaml:
    in: [go.yaml.in/yaml/v3]
components:
  agentcall: { in: agentcall }
  analyst: { in: analyst }
  api: { in: api }
  api-gen: { in: api/gen }
  canonical: { in: canonical }
  checks: { in: checks }
  checksvc: { in: checksvc }
  cmd-check: { in: cmd/check }
  cmd-engine: { in: cmd/engine }
  contracts: { in: contracts }
  durable: { in: durable }
  machine: { in: machine }
  procedures: { in: procedures }
  slices: { in: slices }
  steps: { in: steps }
  store: { in: store }
deps:
  analyst:
    mayDependOn: [agentcall, analyst, slices]
  api:
    # durable, temporal and temporal-testsuite for the durable rig's tests only (T019; package
    # api_test runs the real run workflow in Temporal's testsuite). go-arch-lint cannot tell test
    # files from code, so api's code must not use them: api defines the ports durable implements
    # (data model). Owner-approved 2026-11-19.
    mayDependOn: [api, api-gen, durable, machine, slices, store]
    canUse: [jsonschema, retry-module, slice-module, temporal, temporal-testsuite, yaml]
  api-gen:
    canUse: [oapi-runtime]
  checks:
    mayDependOn: [canonical, checks]
    canUse: [gherkin, messages, modfile, slice-module, yaml]
  checksvc:
    mayDependOn: [canonical, checks, checksvc, procedures]
    canUse: [check-api-gen, jsonschema, yaml]
  cmd-check:
    mayDependOn: [checksvc]
  cmd-engine:
    # A named exception (D40 F2): setup.go holds logic (sliceWorkers, the agent-definition digest),
    # not only wiring; moving it into a package is follow-up T097.
    # durable: the engine starts its Temporal worker and client (T018). temporal and
    # temporal-testsuite for the durable fake's tests only (T019, owner-approved 2026-11-19).
    mayDependOn: [analyst, api, canonical, contracts, durable, machine, slices, steps, store]
    canUse: [slice-module, temporal, temporal-testsuite, yaml]
  contracts:
    mayDependOn: [contracts, slices]
    canUse: [kin-openapi, oasdiff]
  durable:
    # api for the retry rule of the engine contract (api.RetryRule); api defines the ports durable implements.
    mayDependOn: [api, machine, store]
    canUse: [retry-module, temporal]
  machine:
    # durable, retry-module, temporal, temporal-testsuite and yaml for the run workflow's tests (T012).
    mayDependOn: [durable, machine]
    canUse: [jsonschema, retry-module, temporal, temporal-testsuite, yaml]
  procedures:
    mayDependOn: [canonical, checks, procedures]
    canUse: [modfile]
  slices:
    mayDependOn: [canonical, checks, slices]
    canUse: [jsonschema, slice-module, yaml]
  steps:
    # checksvc is a named exception (D40 F1): steps reads only checksvc.APIVersion() and
    # checksvc.CallTimeLimitMax(), which belong in the check contract; follow-up T097.
    mayDependOn: [agentcall, canonical, checksvc, machine, procedures, steps]
    canUse: [check-api-gen]
  store:
    canUse: [slice-module]
