# The analyst: turns a developer's prose description of one use case into one slice proposal
# (spec US1, FR-001..FR-006; research D2, D3, D9, D14, D17). Docker Agent config, schema version 16,
# for the docker-agent pin in src/deploy/images.lock. How the platform runs it: README.md here.
#
# What this definition does not decide (the platform owns it, constitution XIV): the safety mode
# (passed on the command line), egress (the container has no route but the model gateway) and
# telemetry (TELEMETRY_ENABLED=false in the container's environment; Docker Agent has no config
# key for it, and OpenTelemetry stays off because the platform never passes --otel).
version: "16"

metadata:
  description: Proposes a slice (goals, terms, structured EARS rules, Gherkin examples, OpenAPI 3.1 contract, questions) from one use case described in prose.
  version: 0.1.0
  license: MIT

models:
  # Claude Haiku, only through the platform's model gateway (D9). A model version change is a
  # behaviour change (XV): change this pin only with a passing analyst eval run (XIX).
  haiku:
    provider: anthropic
    model: claude-haiku-5-5
    # The gateway (src/deploy/gateway) is the only route out and adds the provider key itself. An
    # unset MODEL_GATEWAY_URL stops the agent at load (Docker Agent never empties base_url).
    base_url: ${env.MODEL_GATEWAY_URL}
    # The Anthropic client refuses to start without a non-empty ANTHROPIC_API_KEY. The container
    # gets a placeholder that is not a key; the gateway overwrites x-api-key on every request.
    token_key: ANTHROPIC_API_KEY
    # One proposal, contract included, fits well inside this; a cut-off answer fails validation.
    max_tokens: 32000
    # Pinned rather than left to the model's default, so the effort cannot change under us.
    thinking_budget: medium
    # Prices per million tokens for prompts up to 100K tokens (the pattern's basis). Given here
    # because Docker Agent does not price a model reached through a custom base_url, and an
    # unpriced model would make the cost budget below count nothing.
    cost:
      input: 0.10
      output: 0.50

agents:
  root:
    model: haiku
    description: Turns one use case described in prose into one slice proposal, as JSON.
    instruction_file: analyst/instruction.md
    # No toolsets: the analyst reads only its prompt and writes only its answer. The one tool it
    # sees is Docker Agent's internal structured-output tool, which the runtime handles itself.
    add_date: false
    add_environment_info: false
    skills: false
    # One short session: nothing to compact, and a summary would lose the description.
    session_compaction: false
    # The first answer, plus room for the runtime's schema-rejection retries and its two
    # reminders when the model answers in plain text.
    max_iterations: 4
    structured_output:
      name: slice_proposal
      # Shown to the model in the tool's description.
      description: The whole slice proposal as the tool's arguments, exactly as the system prompt describes it.
      # Tool mode: the model must answer by calling the internal tool, and the runtime validates the
      # arguments against `schema` before it accepts them, so the answer is one JSON object. Native
      # mode would send the schema to Anthropic's structured outputs, which reject constraints the
      # proposal schema uses (minLength, maxItems, if/then).
      mode: tool
      # The schema is slice-proposal.schema.json made self-contained: Docker Agent takes it only
      # inline and rejects every $ref that does not start with "#", so scripts/generate.sh writes
      # it here with every reference resolved, and `scripts/generate.sh --check-committed` (run by
      # scripts/check.sh and the pre-commit hook) fails when this block differs from the source
      # schemas (XVII). Never edit
      # between the markers; change the schema in src/engine/api/ and run scripts/generate.sh.
      # BEGIN generated by scripts/generate.sh: schema from src/engine/api/preview/2026-11-12-preview/slice-proposal.schema.json
      schema:
        {
          "$schema": "https://json-schema.org/draft/2020-12/schema",
          "title": "SliceProposal",
          "description": "What the analyst agent may output: goals, terms, rules, examples, the contract and new questions. It holds no field the platform or the developer owns.",
          "type": "object",
          "required": [
            "goals",
            "terms",
            "rules",
            "examples",
            "contract"
          ],
          "additionalProperties": false,
          "properties": {
            "goals": {
              "type": "array",
              "minItems": 1,
              "items": {
                "type": "object",
                "required": [
                  "id",
                  "text"
                ],
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "type": "string",
                    "pattern": "^G-[0-9]+$",
                    "description": "A goal ID, `G-<n>`."
                  },
                  "text": {
                    "type": "string",
                    "minLength": 1
                  }
                }
              }
            },
            "terms": {
              "type": "array",
              "items": {
                "type": "object",
                "required": [
                  "id",
                  "name",
                  "definition"
                ],
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "type": "string",
                    "pattern": "^T-[0-9]+$",
                    "description": "A term ID, `T-<n>`."
                  },
                  "name": {
                    "type": "string",
                    "minLength": 1
                  },
                  "definition": {
                    "type": "string",
                    "minLength": 1
                  }
                }
              }
            },
            "rules": {
              "type": "array",
              "minItems": 1,
              "items": {
                "type": "object",
                "description": "A business rule in structured EARS. The slice shows its sentence in `rule_text`.",
                "required": [
                  "id",
                  "goal",
                  "pattern",
                  "system",
                  "response",
                  "terms"
                ],
                "additionalProperties": false,
                "properties": {
                  "id": {
                    "type": "string",
                    "pattern": "^R-[0-9]+$",
                    "description": "A rule ID, `R-<n>`."
                  },
                  "goal": {
                    "type": "string",
                    "pattern": "^G-[0-9]+$",
                    "description": "A goal ID, `G-<n>`."
                  },
                  "pattern": {
                    "type": "string",
                    "enum": [
                      "ubiquitous",
                      "event",
                      "state",
                      "unwanted",
                      "option"
                    ]
                  },
                  "precondition": {
                    "type": "string",
                    "minLength": 1
                  },
                  "trigger": {
                    "type": "string",
                    "minLength": 1
                  },
                  "feature": {
                    "type": "string",
                    "minLength": 1
                  },
                  "system": {
                    "type": "string",
                    "minLength": 1
                  },
                  "response": {
                    "type": "string",
                    "minLength": 1
                  },
                  "terms": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "pattern": "^T-[0-9]+$",
                      "description": "A term ID, `T-<n>`."
                    }
                  }
                },
                "allOf": [
                  {
                    "if": {
                      "properties": {
                        "pattern": {
                          "const": "state"
                        }
                      }
                    },
                    "then": {
                      "required": [
                        "precondition"
                      ]
                    }
                  },
                  {
                    "if": {
                      "properties": {
                        "pattern": {
                          "enum": [
                            "event",
                            "unwanted"
                          ]
                        }
                      }
                    },
                    "then": {
                      "required": [
                        "trigger"
                      ]
                    }
                  },
                  {
                    "if": {
                      "properties": {
                        "pattern": {
                          "const": "option"
                        }
                      }
                    },
                    "then": {
                      "required": [
                        "feature"
                      ]
                    }
                  }
                ]
              }
            },
            "examples": {
              "type": "string",
              "minLength": 1,
              "pattern": "^\\s*[^\"\\s][\\s\\S]*\\n",
              "description": "Gherkin text with one `Rule:` block per rule. Every scenario is tagged `@R-<n>` with the rule of its block and `@E-<n>` with its own example ID, which is unique in the slice and never reused. The ExampleTagged check fails a scenario that lacks either tag, whose `@R-<n>` differs from its block's rule, or whose `@E-<n>` repeats another scenario's. The pattern refuses text whose first non-blank character is `\"` or that has no real line break after its first non-blank character, which is a JSON-encoded or once-more-escaped string rather than the Gherkin itself."
            },
            "contract": {
              "type": "string",
              "minLength": 1,
              "pattern": "^\\s*[^\"\\s][\\s\\S]*\\n",
              "description": "An OpenAPI 3.1 document as YAML text. Every operation has an `operationId` and `x-rules: [R-<n>, ...]`. The pattern refuses text whose first non-blank character is `\"` or that has no real line break after its first non-blank character, which is a JSON-encoded or once-more-escaped string rather than the YAML itself."
            },
            "questions": {
              "type": "array",
              "maxItems": 10,
              "description": "New questions. Together with the slice's earlier questions there are at most 10; more fail the proposal with TooManyQuestions.",
              "items": {
                "type": "object",
                "description": "A question the analyst asks. The platform gives it its `Q-<n>` ID.",
                "required": [
                  "about",
                  "text"
                ],
                "additionalProperties": false,
                "properties": {
                  "about": {
                    "description": "The one item the question concerns.",
                    "type": "string",
                    "pattern": "^(G-[0-9]+|R-[0-9]+|T-[0-9]+|R-[0-9]+/E-[0-9]+|contract/[A-Za-z][A-Za-z0-9]*)$"
                  },
                  "text": {
                    "type": "string",
                    "minLength": 1
                  },
                  "options": {
                    "type": "array",
                    "maxItems": 5,
                    "items": {
                      "type": "string",
                      "minLength": 1
                    },
                    "description": "Up to 5 answers to choose from. Without options, the developer gives a free answer."
                  }
                }
              }
            }
          }
        }
      # END generated by scripts/generate.sh

# Per session, within one pattern step's budget (src/catalogue/api-feature-go/pattern.yaml:
# 1,000,000 tokens, $0.20, 10 minutes). One proposal is about 10K tokens of prompt and up to 32K of
# answer per turn; 4 turns with a growing history stay under 200K tokens, which is about $0.02 of
# input and $0.06 of output at most. Docker Agent checks these at turn boundaries, so a run can
# overshoot by one turn.
budget:
  max_tokens: 200000
  max_cost: 0.10
  max_time: 5m
