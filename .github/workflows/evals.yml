# The live evals (research D41, ADR 0044, T109, T115): each eval case 3 times through the gateway
# with the test-scoped key, on the environment dev's branches, for the suites whose inputs a push
# changed (src/tests/evals/suites.yaml, chosen by scripts/ci-evals-select.py), and every suite when
# started by hand. The key is
# the secret ANTHROPIC_API_KEY of the environment dev and reaches only the evals job. Never on
# pull requests. Changing this file needs the owner's Approved-by (scripts/hooks/commit-msg);
# scripts/tests/test_workflows.py checks its rules.
name: evals

on:
  push:
    branches:
      - main
      - 001-prose-to-accepted-slice
    # Every input of src/tests/evals/suites.yaml (test_eval_suites_declaration.py proves it);
    # scripts/ci-evals-select.py then picks the suites the push changed (T115).
    paths:
      - "src/agents/**"
      - "src/tests/evals/**"
      - "src/deploy/images.lock"
      - "src/deploy/Dockerfile.agent"
      - "src/go.work"
      - "src/go.work.sum"
      - "src/check/go.mod"
      - "src/check/go.sum"
      - "src/cli/go.mod"
      - "src/cli/go.sum"
      - "src/engine/go.mod"
      - "src/engine/go.sum"
      - "src/page/go.mod"
      - "src/page/go.sum"
      - "src/tests/go.mod"
      - "src/tests/go.sum"
      - "src/engine/canonical/**"
      - "src/engine/checks/**"
      - "src/slice/**"
      - "src/engine/api/preview/**"
      - "src/deploy/gateway/**"
      - "src/engine/slices/**"
      - "src/engine/procedures/**"
      - "src/catalogue/api-feature-go/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config:
    name: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read lists this workflow's runs, to find the branch's last successful one (T115).
    permissions:
      contents: read
      actions: read
    outputs:
      runner: ${{ steps.pins.outputs.runner }}
      python: ${{ steps.pins.outputs.python }}
      go: ${{ steps.pins.outputs.go }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pins
        name: Read the CI pins from src/deploy/images.lock
        run: |
          pin() { awk -v n="$1" '$1 == n { print $2 }' src/deploy/images.lock; }
          runner=$(pin ci-runner)
          python=$(pin ci-python)
          go=$(pin golang-race | sed 's/^[a-z]*:\([0-9.]*\)-.*/\1/')
          for v in runner python go; do
            eval "val=\$$v"
            [ -n "$val" ] || { echo "config: no $v pin in src/deploy/images.lock" >&2; exit 1; }
            echo "$v=$val" >>"$GITHUB_OUTPUT"
          done
          cat "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Install the pinned Python packages
        run: python3 -m pip install --require-hashes -r scripts/tools/requirements-ci.txt
      # The suites whose inputs changed since the branch's last successful evals run (T115): GitHub
      # keeps one pending run per concurrency group, so the push's own `before` could miss a dropped
      # run's changes. No such run, or the API not answering: every suite.
      - id: select
        name: Choose the eval suites the push affects
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          BEFORE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/evals.yml/runs?branch=$REF&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null || true)
          [ -z "$BEFORE" ] || git fetch -q --no-tags --depth=1 origin "$BEFORE" || true
          export BEFORE
          matrix=$(python3 scripts/ci-evals-select.py)
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          if [ "$matrix" = "[]" ]; then echo "No eval suite reads what this push changed; the evals job is skipped." >>"$GITHUB_STEP_SUMMARY"; fi

  evals:
    name: evals (${{ matrix.suite }}${{ matrix.cases && format(' {0}', matrix.cases) || '' }})
    needs: config
    if: needs.config.outputs.matrix != '[]'
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 300
    environment: dev
    env:
      # The runner context is not available in a job-level env; the workspace's parent is.
      EVAL_REPORT_DIR: ${{ github.workspace }}/../eval-report
    strategy:
      fail-fast: false
      # The steps suite once per step agent (T109): its 60 trials ran one after another (about an
      # hour); EVAL_CASES (run.sh) takes an agent's name.
      matrix:
        include: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.config.outputs.go }}
          cache: false
      # The step fixture vendors the catalogue template offline (GOPROXY=off): fill the module
      # cache with its modules first, as scripts/check.sh's fill_module_cache does for its fixture.
      - name: Fill the module cache for the step fixture
        if: matrix.suite == 'steps'
        working-directory: src/catalogue/api-feature-go/template
        run: GOWORK=off go mod download
      - name: Install oapi-codegen (pinned in src/deploy/images.lock)
        run: go install "$(awk '$1=="oapi-codegen"{print $2}' src/deploy/images.lock)"
      - name: Write the key file
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          umask 077
          printf '%s' "$ANTHROPIC_API_KEY" >"$RUNNER_TEMP/anthropic_api_key"
      - id: run
        name: Live evals
        env:
          EVAL_KEY_FILE: ${{ runner.temp }}/anthropic_api_key
          SUITE: ${{ matrix.suite }}
          EVAL_CASES: ${{ matrix.cases }}
        run: scripts/ci-step.sh "evals-$SUITE${EVAL_CASES:+-$EVAL_CASES}" sh "src/tests/evals/$SUITE/run.sh" live
      - name: Summary of the evals
        if: always()
        run: python3 scripts/ci-evals-summary.py "$EVAL_REPORT_DIR/report.json"
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/anthropic_api_key"
