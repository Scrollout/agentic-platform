# The checks a push needs (research D41, D50, ADR 0044, ADR 0053, ADR 0074): one job per
# scripts/check.sh step and per acceptance suite, the long suites split across several jobs (one
# per stop point, one per planted scenario) so each test runs in exactly one job, each on its own
# GitHub-hosted runner, then a summary of the run.
# The config job names the jobs whose files changed since the last green check run
# (.github/check-jobs.yaml); the always jobs run on every push, every job on a dispatch. A first
# job reads the runner label and the tool versions from src/deploy/images.lock, their one home.
# Never on pull requests, so a fork's change never runs here. Changing this file needs the
# owner's Approved-by (scripts/hooks/commit-msg); scripts/tests/test_workflows.py checks its rules.
name: Tests and checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: "Plan the run (choose jobs)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read lists this workflow's runs, to find the branch's last green one (T117).
    permissions:
      contents: read
      actions: read
    outputs:
      runner: ${{ steps.pins.outputs.runner }}
      python: ${{ steps.pins.outputs.python }}
      go: ${{ steps.pins.outputs.go }}
      jobs: ${{ steps.select.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pins
        name: Read the CI pins from src/deploy/images.lock
        run: |
          pin() { awk -v n="$1" '$1 == n { print $2 }' src/deploy/images.lock; }
          runner=$(pin ci-runner)
          python=$(pin ci-python)
          go=$(pin golang-race | sed 's/^[a-z]*:\([0-9.]*\)-.*/\1/')
          for v in runner python go; do
            eval "val=\$$v"
            [ -n "$val" ] || { echo "config: no $v pin in src/deploy/images.lock" >&2; exit 1; }
            echo "$v=$val" >>"$GITHUB_OUTPUT"
          done
          cat "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Install the pinned Python packages
        run: python3 -m pip install --require-hashes -r scripts/tools/requirements-ci.txt
      # The jobs whose files changed since the last green check run on a dev branch that is an
      # ancestor of this commit (T117; research D50, ADR 0053), so it needs the full history. No
      # such run, the API not answering, or a dispatch: every job.
      - id: select
        name: Choose the jobs whose files changed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          git fetch -q --unshallow --no-tags origin || echo "::warning::git fetch --unshallow failed: no base can be found, so every job runs"
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?per_page=100" --jq '[.workflow_runs[] | {head_sha, head_branch, conclusion}]' 2>/dev/null || true)
          export RUNS
          python3 scripts/ci-check-select.py

  py_tests:
    name: "Script and hook tests (Python)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'py_tests')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.config.outputs.python }}
      - name: Install the pinned Python packages
        run: python3 -m pip install --require-hashes -r scripts/tools/requirements-ci.txt
      - name: Install the pinned gVisor
        run: scripts/ci-gvisor.sh
      - name: Generated code and module cache
        run: scripts/check.sh --prepare
      - name: Build and sign the check and agent images (a key made for this job)
        run: |
          COSIGN_PASSWORD=$(openssl rand -hex 32)
          export COSIGN_PASSWORD
          src/deploy/build.sh check
          src/deploy/build.sh agent
      - id: run
        name: py-tests
        env:
          AP_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
        run: scripts/ci-step.sh py-tests scripts/check.sh --only py-tests
      # The tests' results in the job's summary (research D43, ADR 0046): counts and each failed
      # test with its message; annotate_only needs no checks: write. A green job writes no table
      # and a step that finds no result fails (research D47, ADR 0051); the summary is written only
      # when the job has failed (research D49, ADR 0052).
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: ${{ runner.temp }}/test-reports/*.xml
          annotate_only: true
          detailed_summary: true
          include_passed: false
          skip_success_summary: true
          require_tests: true
          job_summary: ${{ job.status != 'success' }}

  layout:
    name: "Repository layout"
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.config.outputs.python }}
      - name: Install the pinned Python packages
        run: python3 -m pip install --require-hashes -r scripts/tools/requirements-ci.txt
      - id: run
        name: layout
        run: scripts/ci-step.sh layout scripts/check.sh --only layout

  knowledge:
    name: "Documentation (knowledge bundle)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'knowledge')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.config.outputs.python }}
      - name: Install the pinned Python packages
        run: python3 -m pip install --require-hashes -r scripts/tools/requirements-ci.txt
      - id: run
        name: knowledge
        run: scripts/ci-step.sh knowledge scripts/check.sh --only knowledge

  markdown:
    name: "Markdown style"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'markdown')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: run
        name: markdown
        run: scripts/ci-step.sh markdown scripts/check.sh --only markdown

  contracts:
    name: "API contracts lint"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'contracts')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: run
        name: contracts
        run: scripts/ci-step.sh contracts scripts/check.sh --only contracts

  contract_diff:
    name: "API breaking changes"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'contract_diff')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: run
        name: contract-diff
        run: scripts/ci-step.sh contract-diff scripts/check.sh --only contract-diff

  gateway:
    name: "Model gateway config"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'gateway')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: run
        name: gateway
        run: scripts/ci-step.sh gateway scripts/check.sh --only gateway

  go:
    name: "Go unit tests and vet"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'go')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: run
        name: go
        env:
          AP_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
        run: scripts/ci-step.sh go scripts/check.sh --only go
      # The tests' results in the job's summary (research D43, ADR 0046): counts and each failed
      # test with its message; annotate_only needs no checks: write. A green job writes no table
      # and a step that finds no result fails (research D47, ADR 0051); the summary is written only
      # when the job has failed (research D49, ADR 0052).
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: ${{ runner.temp }}/test-reports/*.xml
          annotate_only: true
          detailed_summary: true
          include_passed: false
          skip_success_summary: true
          require_tests: true
          job_summary: ${{ job.status != 'success' }}

  # Module boundaries (T098; research D40, D54): go-arch-lint over each Go module's archfile. The
  # generated api/gen packages it maps are not in git, so --prepare makes them first.
  arch:
    name: "Module boundaries (go-arch-lint)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'arch')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated code and module cache
        run: scripts/check.sh --prepare
      - id: run
        name: arch
        run: scripts/ci-step.sh arch scripts/check.sh --only arch

  # Each test of the Docker suites runs in exactly one job (ADR 0074): this job skips the tests
  # the stop-point, planted and Story 2 jobs run. The anchors (&) here are reused by those jobs.
  docker:
    name: "Service tests with Docker (recorded model)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'docker')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs: &step-outputs
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &prepare
        name: Generated code and module cache
        run: scripts/check.sh --prepare
      - &gvisor
        name: Install the pinned gVisor
        run: scripts/ci-gvisor.sh
      - id: run
        name: docker
        env:
          AP_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
          AP_ACCEPTANCE_SKIP: '^(TestPlanted|TestStopPoints|TestUS2.*)$'
        run: scripts/ci-step.sh docker scripts/check.sh --only docker
      # The tests' results in the job's summary (research D43, ADR 0046): counts and each failed
      # test with its message; annotate_only needs no checks: write. A green job writes no table
      # and a step that finds no result fails (research D47, ADR 0051); the summary is written only
      # when the job has failed (research D49, ADR 0052).
      - &test-report
        name: Test report
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: ${{ runner.temp }}/test-reports/*.xml
          annotate_only: true
          detailed_summary: true
          include_passed: false
          skip_success_summary: true
          require_tests: true
          job_summary: ${{ job.status != 'success' }}

  # TestStopPoints, one job per stop point of stopPoints (src/tests/acceptance/stop_points_test.go;
  # ADR 0074), built as the docker job builds it: the stop point's 3 trials and the uninterrupted
  # run they are compared with, which each job runs for itself.
  stop_points_agent_step:
    name: "Acceptance: a stopped run continues (agent-step)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'stop_points_agent_step')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs: *step-outputs
    steps:
      - *checkout
      - *prepare
      - *gvisor
      - id: run
        name: stop-points-agent-step
        env:
          AP_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
          AP_ACCEPTANCE_RUN: '^TestStopPoints$/^(uninterrupted|agent-step)$'
        run: scripts/ci-step.sh stop-points-agent-step scripts/check.sh --only docker
      - *test-report

  stop_points_procedure_step:
    name: "Acceptance: a stopped run continues (procedure-step)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'stop_points_procedure_step')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs: *step-outputs
    steps:
      - *checkout
      - *prepare
      - *gvisor
      - id: run
        name: stop-points-procedure-step
        env:
          AP_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
          AP_ACCEPTANCE_RUN: '^TestStopPoints$/^(uninterrupted|procedure-step)$'
        run: scripts/ci-step.sh stop-points-procedure-step scripts/check.sh --only docker
      - *test-report

  stop_points_review_round:
    name: "Acceptance: a stopped run continues (review-round)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'stop_points_review_round')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs: *step-outputs
    steps:
      - *checkout
      - *prepare
      - *gvisor
      - id: run
        name: stop-points-review-round
        env:
          AP_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
          AP_ACCEPTANCE_RUN: '^TestStopPoints$/^(uninterrupted|review-round)$'
        run: scripts/ci-step.sh stop-points-review-round scripts/check.sh --only docker
      - *test-report

  stop_points_version_history_commit:
    name: "Acceptance: a stopped run continues (version-history-commit)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'stop_points_version_history_commit')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs: *step-outputs
    steps:
      - *checkout
      - *prepare
      - *gvisor
      - id: run
        name: stop-points-version-history-commit
        env:
          AP_TEST_REPORT_DIR: ${{ runner.temp }}/test-reports
          AP_ACCEPTANCE_RUN: '^TestStopPoints$/^(uninterrupted|version-history-commit)$'
        run: scripts/ci-step.sh stop-points-version-history-commit scripts/check.sh --only docker
      - *test-report

  deps:
    name: "Dependencies and licences"
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated code and module cache
        run: scripts/check.sh --prepare
      - id: run
        name: deps
        run: scripts/ci-step.sh deps scripts/check.sh --only deps

  secrets:
    name: "Secret scan"
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: run
        name: secrets
        run: scripts/ci-step.sh secrets scripts/check.sh --only secrets

  # TestPlanted, one job per scenario of plantedScenarios (src/tests/acceptance/planted_test.go;
  # ADR 0074): `ap test planted <scenario>` runs that scenario's 3 trials.
  ap_test_planted_edit_judging_tests:
    name: "Acceptance: planted defects are stopped (edit-judging-tests)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'ap_test_planted_edit_judging_tests')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs: *step-outputs
    steps:
      - *checkout
      - *gvisor
      - *prepare
      - id: run
        name: ap-test-planted-edit-judging-tests
        run: scripts/ci-step.sh ap-test-planted-edit-judging-tests src/deploy/ap test planted edit-judging-tests

  ap_test_planted_outside_scope:
    name: "Acceptance: planted defects are stopped (outside-scope)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'ap_test_planted_outside_scope')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs: *step-outputs
    steps:
      - *checkout
      - *gvisor
      - *prepare
      - id: run
        name: ap-test-planted-outside-scope
        run: scripts/ci-step.sh ap-test-planted-outside-scope src/deploy/ap test planted outside-scope

  ap_test_planted_forbidden_dependency:
    name: "Acceptance: planted defects are stopped (forbidden-dependency)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'ap_test_planted_forbidden_dependency')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs: *step-outputs
    steps:
      - *checkout
      - *gvisor
      - *prepare
      - id: run
        name: ap-test-planted-forbidden-dependency
        run: scripts/ci-step.sh ap-test-planted-forbidden-dependency src/deploy/ap test planted forbidden-dependency

  ap_test_planted_claims_done:
    name: "Acceptance: planted defects are stopped (claims-done)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'ap_test_planted_claims_done')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs: *step-outputs
    steps:
      - *checkout
      - *gvisor
      - *prepare
      - id: run
        name: ap-test-planted-claims-done
        run: scripts/ci-step.sh ap-test-planted-claims-done src/deploy/ap test planted claims-done

  ap_test_planted_non_converging_review:
    name: "Acceptance: planted defects are stopped (non-converging-review)"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'ap_test_planted_non_converging_review')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs: *step-outputs
    steps:
      - *checkout
      - *gvisor
      - *prepare
      - id: run
        name: ap-test-planted-non-converging-review
        run: scripts/ci-step.sh ap-test-planted-non-converging-review src/deploy/ap test planted non-converging-review

  ap_test_us2:
    name: "Acceptance: Story 2, slice to accepted change"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'ap_test_us2')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 120
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned gVisor
        run: scripts/ci-gvisor.sh
      - name: Generated code and module cache
        run: scripts/check.sh --prepare
      - id: run
        name: ap-test-us2
        run: scripts/ci-step.sh ap-test-us2 src/deploy/ap test us2

  e2e:
    name: "End-to-end: full stack in Compose"
    needs: config
    if: contains(fromJSON(needs.config.outputs.jobs), 'e2e')
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 90
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned gVisor
        run: scripts/ci-gvisor.sh
      - name: Generated code and module cache
        run: scripts/check.sh --prepare
      # The Compose stack on the recorded model (research D44, ADR 0047); e2e.sh builds and signs
      # the images with a key made for this job.
      - id: run
        name: e2e
        run: |
          COSIGN_PASSWORD=$(openssl rand -hex 32)
          export COSIGN_PASSWORD
          scripts/ci-step.sh e2e scripts/check.sh --only e2e

  # The suites whose evals are pending (research D45, ADR 0048, T120): keyless; the selector
  # compares this commit with the last green evals run on a dev branch that is its ancestor. A
  # notice on the feature branch; on main it fails while a suite is pending. Runs on every push.
  evals-current:
    name: "Agent evals up to date"
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      seconds: ${{ steps.run.outputs.seconds }}
      error: ${{ steps.run.outputs.error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.config.outputs.python }}
      - name: Install the pinned Python packages
        run: python3 -m pip install --require-hashes -r scripts/tools/requirements-ci.txt
      - id: run
        name: evals-current
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: pending
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          git fetch -q --unshallow --no-tags origin
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/evals.yml/runs?per_page=100" --jq '[.workflow_runs[] | {head_sha, head_branch, conclusion}]' 2>/dev/null || true)
          export RUNS
          scripts/ci-step.sh evals-current python3 scripts/ci-evals-select.py

  summary:
    name: "Run summary"
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - config
      - py_tests
      - layout
      - knowledge
      - markdown
